# BotShield — painel de bots (isolado)
# DNS: A botshield → mesmo IP da VPS
# Cert: certbot --nginx -d botshield.arbishield.app
# UI: /var/www/arbishield-botshield
# NÃO aparece no app/admin de arbishield.app — só URL direta.

server {
    listen 80;
    listen [::]:80;
    server_name botshield.arbishield.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arbishield;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name botshield.arbishield.app;

    ssl_certificate /etc/letsencrypt/live/botshield.arbishield.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/botshield.arbishield.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    root /var/www/arbishield-botshield;
    index index.html;

    add_header X-ArbiShield-Site "botshield" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Bloqueia path clássico do app/admin neste host
    location ~ ^/(app|admin|v2)(/|$) {
        return 404;
    }

    location ~ ^/(auth|rest|storage|functions|graphql|realtime)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Ordens / sessão exchange (shim produção :3101; fallback teste :3201 via env no enable)
    location ~ ^/api/arbishield/(exchange-session/connect|exchange-session/disconnect|exchange-session/status|exchange-session/balance|exchange-session/mexchange-account|exchange-session/local-bridge|exchange-orders|exchange-orders/place|exchange-orders/cancel|exchange-orders/status)$ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
