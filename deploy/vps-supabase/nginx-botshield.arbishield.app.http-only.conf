# BotShield — HTTP only (antes do certbot)
# Após DNS, use para servir UI e emitir cert; depois troque pela conf SSL.

server {
    listen 80;
    listen [::]:80;
    server_name botshield.arbishield.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arbishield;
        default_type "text/plain";
    }

    root /var/www/arbishield-botshield;
    index index.html;

    add_header X-ArbiShield-Site "botshield" always;

    location ~ ^/(app|admin|v2)(/|$) {
        return 404;
    }

    location ~ ^/(auth|rest|storage|functions|graphql|realtime)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/api/arbishield/(exchange-session/connect|exchange-session/disconnect|exchange-orders|exchange-orders/place|exchange-orders/cancel|exchange-orders/status)$ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
