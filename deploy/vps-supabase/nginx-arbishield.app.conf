# ArbiShield — DOMÍNIO PRINCIPAL = sistema novo (v2)
# DNS: A @ e www → VPS
# SPA antigo: legado.arbishield.app (ver nginx-legado.arbishield.app.conf)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name arbishield.app www.arbishield.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arbishield;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name arbishield.app www.arbishield.app;

    ssl_certificate /etc/letsencrypt/live/arbishield.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arbishield.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # UI nova
    root /var/www/arbishield/v2;

    # Supabase / Kong (mesmo host — sessão same-origin)
    location ~ ^/(auth|rest|storage|functions|graphql|realtime)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/arbishield/prelive-events {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    location = /api/arbishield/matches {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/football-teams {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/protections {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/create-protection {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/desafios {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # Shim :3101 — participação/settle Desafio + distribuição Provedor + transferências + liquidar partida + contestações
    location ~ ^/api/arbishield/(desafio-register|desafio-settle|desafio-cancel|desafio-sinal|desafio-sinal-preview|desafio-jornada|desafio-journey|desafio-participations|partner-rounds|partner-distribute|transfer-desafio|affiliate-ensure-code|affiliate-withdraw|protection-close|protection-cancel|match-settle|manual-deposit-approve|manual-deposit-reject|manual-deposit-mark-credited|contestations|contestations/submit|contestations/approve|contestations/reject|contestations/pending-count)$ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    location = /api/arbishield/match-settle {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    # Sugestões BetBra removidas
    location /api/arbishield/desafio-suggestions {
        default_type application/json;
        return 410 '{"ok":false,"error":"Sugestões BetBra removidas"}';
    }

    location = /api/arbishield/dashboard {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location /arbishield {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Contestacoes → shim :3101 (prefixo ^~ evita cair no try_files / 405)
    location ^~ /api/arbishield/contestations {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    location ^~ /_serverFn/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    # Assets do disco principal (ícones etc.)
    location /assets/ {
        root /var/www/arbishield;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Compat: bookmarks /v2/... → raiz
    location = /v2 { return 302 /; }
    location ^~ /v2/ {
        rewrite ^/v2/(.*)$ /$1 permanent;
    }

    # Rotas amigáveis do produto → páginas v2
    location = /auth { return 302 /auth.html$is_args$args; }
    location = /admin { return 302 /admin.html; }
    location = /adm { return 302 /admin.html; }
    location = /admin/login { return 302 /auth.html; }
    location = /admin/matches { return 302 /admin-jogos.html; }
    location = /admin/desafios { return 302 /admin-desafios.html; }
    location = /admin/users { return 302 /admin-users.html; }
    location = /admin/transactions { return 302 /admin-transactions.html; }
    location = /admin/saques { return 302 /admin-saques.html; }
    location = /admin/manual-deposits { return 302 /admin-manual-deposits.html; }
    location = /admin/depositos-desafio { return 302 /admin-depositos-desafio.html; }
    location = /admin/refunds { return 302 /admin-refunds.html; }
    location = /admin/treasury { return 302 /admin-treasury.html; }
    location = /admin/partners-distribution { return 302 /admin-partners-distribution.html; }
    location = /admin/expenses { return 302 /admin-expenses.html; }
    location = /admin/partners { return 302 /admin-partners.html; }
    location = /admin/affiliates { return 302 /admin-affiliates.html; }
    location = /admin/contestations { return 302 /admin-contestations.html; }
    location = /admin/approvals { return 302 /admin-approvals.html; }
    location = /admin/proofs { return 302 /admin-proofs.html; }
    location = /admin/investigation { return 302 /admin-investigation.html; }
    location = /admin/risk { return 302 /admin-risk.html; }
    location = /admin/blacklist { return 302 /admin-blacklist.html; }
    location = /admin/geo { return 302 /admin-geo.html; }
    location = /admin/signup-attempts { return 302 /admin-signup-attempts.html; }
    location = /admin/whatsapp { return 302 /admin-whatsapp.html; }
    location = /admin/communication-lab { return 302 /admin-communication-lab.html; }
    location = /admin/banners { return 302 /admin-banners.html; }
    location = /admin/onboarding { return 302 /admin-onboarding.html; }
    location = /admin/academia { return 302 /admin-academia.html; }
    location = /admin/support { return 302 /admin-support.html; }
    location = /admin/support-ai { return 302 /admin-support-ai.html; }
    location = /admin/settings { return 302 /admin-settings.html; }
    location = /admin/betting-houses { return 302 /admin-betting-houses.html; }
    location = /admin/permissoes { return 302 /admin-permissoes.html; }
    location = /admin/marketing-team { return 302 /admin-marketing-team.html; }
    location = /admin/logs { return 302 /admin-logs.html; }
    location = /admin/settlements-audit { return 302 /admin-settlements-audit.html; }
    location = /admin/technical-audit { return 302 /admin-technical-audit.html; }
    location = /admin/performance { return 302 /admin-performance.html; }
    location = /admin/siem { return 302 /admin-siem.html; }
    location = /admin/monitoring { return 302 /admin-monitoring.html; }
    location = /admin/monitoring-protections { return 302 /admin-monitoring-protections.html; }
    location ^~ /admin/ { return 302 /admin.html; }

    location = /app { return 302 /app.html; }
    location = /app/proteger { return 302 /app-proteger.html; }
    location = /app/protecoes { return 302 /app-protecoes.html; }
    location = /app/desafio { return 302 /app-desafio.html; }
    location = /app/desafio/jornada { return 302 /app-desafio-jornada.html; }
    location = /app/desafio/lista { return 302 /app-desafio.html; }
    location = /app/desafio/sinais { return 302 /app-desafio.html; }
    location = /app/carteira { return 302 /app-carteira.html; }
    location = /app/suporte { return 302 /app-suporte.html; }
    location = /app/afiliados { return 302 /app-afiliados.html; }
    location = /app/partners { return 302 /app-partners.html; }
    location = /app/baixar-app { return 302 /app-baixar-app.html; }
    location = /app/perfil { return 302 /app-perfil.html; }
    location = /app/configuracoes { return 302 /app-config.html; }
    location ^~ /app/ { return 302 /app.html; }
    location ^~ /m { return 302 /app.html; }

    # SPA antigo → subdomínio
    location = /legado { return 302 https://legado.arbishield.app/; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
