# ArbiShield — arbishield.app (HTTPS)
# DNS: A @ e www → VPS · certs: /etc/letsencrypt/live/arbishield.app/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name arbishield.app www.arbishield.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arbishield;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name arbishield.app www.arbishield.app;

    ssl_certificate /etc/letsencrypt/live/arbishield.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arbishield.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;
    root /var/www/arbishield;

    location ~ ^/(auth|rest|storage|functions|graphql|realtime)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/arbishield/prelive-events {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    location = /api/arbishield/matches {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/desafios {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location /api/arbishield/desafio-suggestions {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    location /api/arbishield/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    location /arbishield {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /desafio-sugestoes.html {
        try_files /desafio-sugestoes.html =404;
        add_header Cache-Control "no-store";
    }

    location = /assets/desafio-sugestoes-inject.js {
        try_files /assets/desafio-sugestoes-inject.js =404;
        add_header Cache-Control "no-store";
    }

    location = /admin/login {
        try_files /admin-login-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /auth {
        try_files /auth-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /admin/desafios {
        try_files /admin-desafios-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /admin/matches {
        try_files /admin-jogos-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /admin {
        return 302 /admin/matches;
    }

    location = /adm {
        return 302 /admin/matches;
    }

    location = / {
        return 302 /admin/matches;
    }

    location / {
        try_files $uri =404;
    }
}
