# Produção ArbiShield na VPS (sem Lovable)
# DNS necessário (Hostinger hPanel):
#   A   @     → 195.200.6.206
#   A   www   → 195.200.6.206
# Depois: certbot --nginx -d arbishield.app -d www.arbishield.app

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name arbishield.app www.arbishield.app 195.200.6.206 srv1841537.hstgr.cloud;

    client_max_body_size 50m;
    root /var/www/arbishield;
    index index.html;

    # API Supabase (Kong) — same-origin
    location ~ ^/(auth|rest|storage|functions|graphql|realtime)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Sugestões de desafio (BetBra → surebet ArbiShield)
    location /api/arbishield/desafio-suggestions {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /desafio-sugestoes.html {
        try_files /desafio-sugestoes.html =404;
        add_header Cache-Control "no-store";
    }

    location = /assets/desafio-sugestoes-inject.js {
        try_files /assets/desafio-sugestoes-inject.js =404;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
