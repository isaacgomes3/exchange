# Produção ArbiShield na VPS (HTTPS, sem Lovable)
# Certificados: /etc/letsencrypt/live/arbishield.app/
# DNS: A @ e www → 195.200.6.206

# HTTP → HTTPS (domínio); IP permanece em HTTP para diagnóstico
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name arbishield.app www.arbishield.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arbishield;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name 195.200.6.206 srv1841537.hstgr.cloud;

    client_max_body_size 50m;
    root /var/www/arbishield;
    index index.html;

    location ~ ^/(auth|rest|storage|functions|graphql|realtime)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /_serverFn/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/desafios {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }

    location /api/arbishield/desafio-suggestions {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /desafio-sugestoes.html {
        try_files /desafio-sugestoes.html =404;
        add_header Cache-Control "no-store";
    }

    location = /manifest.json {
        try_files /manifest.json =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-store";
    }

    location = /assets/desafio-sugestoes-inject.js {
        try_files /assets/desafio-sugestoes-inject.js =404;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /admin = SPA original (layout nativo). Atalho /adm → /admin.
    location = /admin/ {
        return 301 /admin;
    }

    location = /adm {
        return 301 /admin;
    }

    # Gestão de Desafios — página VPS (não depende de chunks SPA ausentes)
    location = /admin/desafios {
        try_files /admin-desafios-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    # Login admin — chunk SPA admin.login-*.js ausente no espelho
    location = /admin/login {
        try_files /admin-login-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    # Login do app — SPA /auth trava no browser; página leve na VPS
    # (API continua em /auth/v1/* via location regex acima)
    location = /auth {
        try_files /auth-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }


    # Service workers reais (nunca devolver index.html como SW)
    location = /sw.js {
        try_files /sw.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /firebase-messaging-sw.js {
        try_files /firebase-messaging-sw.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name arbishield.app www.arbishield.app;

    ssl_certificate /etc/letsencrypt/live/arbishield.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arbishield.app/privkey.pem;
