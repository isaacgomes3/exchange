# ArbiShield — AMBIENTE DE TESTE via localhost/porta (SEM DNS)
# Acesso: http://IP_DA_VPS:8090/  ou  http://127.0.0.1:8090/
# NÃO altera arbishield.app (80/443)

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    add_header X-ArbiShield-Site "teste-localhost" always;
    client_max_body_size 50m;
    root /var/www/arbishield-teste/v2;

    location ~ ^/(auth|rest|storage|functions|graphql|realtime)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/arbishield/prelive-events {
        proxy_pass http://127.0.0.1:3198;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    # Busca de times + logos (Admin Lançar Evento) — NÃO remover
    location /api/arbishield/football-teams {
        proxy_pass http://127.0.0.1:3198;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }


    location = /api/arbishield/matches {
        proxy_pass http://127.0.0.1:3198;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/protections {
        proxy_pass http://127.0.0.1:3198;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/create-protection {
        proxy_pass http://127.0.0.1:3198;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/desafios {
        proxy_pass http://127.0.0.1:3198;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/arbishield/(desafio-register|desafio-settle|desafio-step-update|desafio-sinal|desafio-sinal-preview|desafio-jornada|desafio-journey|desafio-participations|desafio-delete|desafio-cancel|desafio-pending-counts|partner-rounds|partner-distribute|transfer-desafio|affiliate-ensure-code|affiliate-withdraw|deduction-withdraw|protection-close|protection-cancel|match-settle|contestations|contestations/submit|contestations/approve|contestations/reject|contestations/pending-count|dashboard-stats)$ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    location = /api/arbishield/match-settle {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    location = /api/arbishield/dashboard-stats {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    location ^~ /api/arbishield/contestations {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    location ^~ /_serverFn/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        root /var/www/arbishield;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /v2 { return 302 /; }
    location ^~ /v2/ { rewrite ^/v2/(.*)$ /$1 permanent; }

    location = /admin { return 302 /admin.html; }
    location = /admin/matches { return 302 /admin-jogos.html; }
    location = /auth { return 302 /auth.html$is_args$args; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
