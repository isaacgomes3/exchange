# ArbiShield — SPA LEGADO (temporário)
# DNS: A legado → mesmo IP da VPS
# Cert: certbot --nginx -d legado.arbishield.app

server {
    listen 80;
    listen [::]:80;
    server_name legado.arbishield.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arbishield;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name legado.arbishield.app;

    # Se o cert ainda não existir, o cutover script gera com certbot.
    ssl_certificate /etc/letsencrypt/live/legado.arbishield.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legado.arbishield.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;
    root /var/www/arbishield;

    # Banner leve: deixa claro que é o legado
    add_header X-ArbiShield-Site "legado-spa" always;

    location ~ ^/(auth|rest|storage|functions|graphql|realtime)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/arbishield/prelive-events {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    # Busca de times + logos (Admin Lançar Evento) — NÃO remover
    location /api/arbishield/football-teams {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }


    location = /api/arbishield/matches {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # Sync placar/tempo BetBra (inplay) — Node :3098
    location = /api/arbishield/match-live-sync {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }
    location = /api/arbishield/match-score-sync {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/protections {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/create-protection {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/desafios {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/arbishield/(desafio-register|desafio-settle|desafio-sinal|desafio-sinal-preview|desafio-jornada|desafio-journey|desafio-participations|desafio-delete|desafio-cancel|desafio-pending-counts|partner-rounds|partner-distribute|transfer-desafio|affiliate-ensure-code|affiliate-withdraw|deduction-withdraw|protection-close|protection-cancel|match-settle)$ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    location = /api/arbishield/match-settle {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    # Sugestões BetBra removidas
    location /api/arbishield/desafio-suggestions {
        default_type application/json;
        return 410 '{"ok":false,"error":"Sugestões BetBra removidas"}';
    }

    location = /api/arbishield/dashboard {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location /arbishield {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location ^~ /_serverFn/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    location = /admin/login {
        try_files /admin-login-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /auth {
        try_files /auth-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /admin/matches {
        try_files /admin-jogos-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /admin/desafios {
        try_files /admin-desafios-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /desafio-sugestoes.html {
        try_files /desafio-sugestoes.html =404;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA catch-all (site antigo)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
