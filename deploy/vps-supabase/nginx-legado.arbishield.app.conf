# ArbiShield — legado.arbishield.app DESATIVADO
# Tudo redireciona para o sistema novo (arbishield.app).
# DNS A legado pode permanecer apontando para a VPS (só redireciona).

server {
    listen 80;
    listen [::]:80;
    server_name legado.arbishield.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arbishield;
        default_type "text/plain";
    }

    location / {
        return 301 https://arbishield.app$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name legado.arbishield.app;

    ssl_certificate /etc/letsencrypt/live/legado.arbishield.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legado.arbishield.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-ArbiShield-Site "legado-retired" always;

    # SPA antigo / admin-vps: não servir mais — manda para o V2
    location / {
        return 301 https://arbishield.app$request_uri;
    }
}
