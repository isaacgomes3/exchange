<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Entrar — ArbiShield</title>
  <style>
    :root {
      --bg: #010b08;
      --panel: #031e18;
      --border: rgba(245, 245, 247, 0.12);
      --text: #f5f5f7;
      --muted: #8a8a8f;
      --lime: #c9f223;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: grid; place-items: center; padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 22px;
    }
    .brand {
      font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
      font-size: 12px; color: var(--lime); margin-bottom: 10px;
    }
    h1 { margin: 0 0 6px; font-size: 1.7rem; text-transform: uppercase; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
    label {
      display: block; font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 6px;
    }
    input[type="email"], input[type="password"] {
      width: 100%; border-radius: 12px; border: 1px solid var(--border);
      background: #010b08; color: var(--text);
      padding: 13px 14px; margin-bottom: 14px; font: inherit;
    }
    input:focus { outline: 2px solid rgba(201,242,35,0.35); }
    .btn {
      width: 100%; border: 0; border-radius: 12px; padding: 14px 16px;
      font-weight: 800; font-size: 12px; letter-spacing: 0.1em;
      text-transform: uppercase; cursor: pointer;
      background: var(--lime); color: #04140f;
    }
    .btn:disabled { opacity: 0.65; cursor: wait; }
    .msg {
      display: none; margin-bottom: 12px; padding: 10px 12px;
      border-radius: 10px; font-size: 13px;
    }
    .msg.err { border: 1px solid rgba(248,113,113,0.4); color: var(--danger); background: rgba(248,113,113,0.08); }
    .msg.ok { border: 1px solid rgba(201,242,35,0.35); color: var(--lime); background: rgba(201,242,35,0.08); }
    .msg.show { display: block; }
    .links { margin-top: 16px; display: flex; justify-content: space-between; font-size: 12px; }
    .links a { color: var(--muted); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">ArbiShield</div>
    <h1>Entrar</h1>
    <p class="sub">Acesse sua conta para continuar.</p>
    <div class="msg err" id="err"></div>
    <div class="msg ok" id="ok"></div>
    <form id="form" autocomplete="on">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" required placeholder="seu@email.com" />
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
      <button class="btn" id="btn" type="submit">Entrar</button>
    </form>
    <div class="links">
      <a href="/">Voltar</a>
      <a href="#" id="forgot">Esqueci minha senha</a>
    </div>
  </div>
  <script>
    (function () {
      const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg0NDc5OTk4LCJleHAiOjE5NDIxNTk5OTh9.mxLqs20sCUNn58jWlsD0sznclCOr8rbksjTEAuQee3s";
      const STORAGE_KEY = "sb-arbishield-auth-token";
      const params = new URLSearchParams(location.search);
      let redirectTo = params.get("redirect") || "/app";
      if (!redirectTo.startsWith("/") || redirectTo.startsWith("//") || redirectTo === "/auth") {
        redirectTo = "/app";
      }

      const errEl = document.getElementById("err");
      const okEl = document.getElementById("ok");
      const btn = document.getElementById("btn");

      function show(el, msg) {
        errEl.classList.remove("show");
        okEl.classList.remove("show");
        el.textContent = msg;
        el.classList.add("show");
      }

      function clearAuthStorage() {
        const drop = [];
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && /(auth|supabase|sb-)/i.test(k)) drop.push(k);
          }
        } catch {}
        drop.forEach((k) => {
          try { localStorage.removeItem(k); } catch {}
          try { sessionStorage.removeItem(k); } catch {}
        });
      }

      // 1) derruba service workers / caches que fazem a UI travar ao digitar
      async function nukeServiceWorkers() {
        try {
          if (!("serviceWorker" in navigator)) return;
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        } catch {}
        try {
          if (!window.caches) return;
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        } catch {}
      }

      async function passwordLogin(email, password) {
        const res = await fetch("/auth/v1/token?grant_type=password", {
          method: "POST",
          headers: {
            apikey: ANON,
            Authorization: "Bearer " + ANON,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const msg = data.error_description || data.msg || data.error || "Falha no login";
          throw new Error(msg);
        }
        // Formato compatível com supabase-js v2
        const session = {
          access_token: data.access_token,
          refresh_token: data.refresh_token,
          expires_in: data.expires_in,
          expires_at: data.expires_at || Math.floor(Date.now() / 1000) + (data.expires_in || 3600),
          token_type: data.token_type || "bearer",
          user: data.user,
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
        localStorage.setItem("auth_login_pending_until", String(Date.now() + 15000));
        return session;
      }

      async function resetPassword(email) {
        const res = await fetch("/auth/v1/recover", {
          method: "POST",
          headers: {
            apikey: ANON,
            Authorization: "Bearer " + ANON,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.msg || data.error || "Falha ao enviar recuperação");
        }
      }

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = "Entrando…";
        try {
          await nukeServiceWorkers();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          await passwordLogin(email, password);
          show(okEl, "Acesso autorizado. Abrindo…");
          location.replace(redirectTo);
        } catch (err) {
          const msg = String(err.message || err);
          show(errEl, /invalid/i.test(msg) ? "E-mail ou senha inválidos." : msg);
          btn.disabled = false;
          btn.textContent = "Entrar";
        }
      });

      document.getElementById("forgot").addEventListener("click", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        if (!email) {
          show(errEl, "Informe o e-mail para recuperar a senha.");
          return;
        }
        try {
          await resetPassword(email);
          show(okEl, "Se o e-mail existir, enviamos o link de recuperação.");
        } catch (err) {
          show(errEl, err.message || String(err));
        }
      });

      // limpeza inicial DEPOIS do idle — não compete com a digitação
      function afterIdle(fn) {
        if ("requestIdleCallback" in window) requestIdleCallback(fn, { timeout: 2000 });
        else setTimeout(fn, 500);
      }
      afterIdle(function () {
        nukeServiceWorkers().then(function () {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            var parsed = JSON.parse(raw);
            var token = parsed.access_token;
            if (!token || token.length < 20) {
              clearAuthStorage();
              return;
            }
            fetch("/auth/v1/user", {
              headers: { apikey: ANON, Authorization: "Bearer " + token },
              cache: "no-store",
            }).then(function (r) {
              if (r.status === 401 || r.status === 403) clearAuthStorage();
            }).catch(function () {});
          } catch (e) {
            clearAuthStorage();
          }
        });
      });
    })();
  </script>
</body>
</html>
