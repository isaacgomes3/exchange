<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestão de Desafios — ArbiShield v2</title>
  <link rel="stylesheet" href="/v2.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="/v2.js"></script>
  <script src="/v2-shell.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --panel: #0a0a0a;
      --border: #1f1f1f;
      --text: #f5f5f7;
      --muted: #8a8a8f;
      --lime: #c9f223;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--text);
    }
    .wrap { width: 100%; max-width: none; margin: 0; padding: 0 0 48px; }
    header {
      display: flex; flex-wrap: wrap; gap: 14px;
      align-items: flex-start; justify-content: space-between;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0; font-size: clamp(1.5rem, 3vw, 2.1rem);
      font-weight: 900; font-style: italic;
      letter-spacing: -0.04em; text-transform: uppercase;
    }
    h1 span { color: var(--lime); }
    .sub {
      margin: 6px 0 0; color: var(--muted); font-size: 0.72rem;
      letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700;
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      border: 0; border-radius: 12px; padding: 12px 16px;
      font-weight: 800; font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary {
      background: var(--lime); color: #000;
      box-shadow: 0 0 20px rgba(201,242,35,0.25);
    }
    .btn-ghost {
      background: transparent; color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-lime-outline {
      background: transparent; color: var(--lime);
      border: 1px solid rgba(201,242,35,0.4);
    }
    .filters {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin: 0 0 16px;
    }
    .filters input[type="search"] {
      flex: 1; min-width: 200px; border-radius: 12px;
      border: 1px solid var(--border); background: #050505;
      color: var(--text); padding: 12px 14px;
    }
    .tab {
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); border-radius: 999px; padding: 8px 12px;
      font-size: 9px; font-weight: 800; letter-spacing: 0.12em;
      text-transform: uppercase; cursor: pointer;
    }
    .tab.is-on { background: var(--lime); color: #022c22; border-color: var(--lime); }
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px; margin-bottom: 20px;
    }
    .stat {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 14px;
    }
    .stat .l {
      font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); font-weight: 800;
    }
    .stat .v {
      font-size: 1.5rem; font-weight: 900; font-style: italic; margin-top: 4px;
    }
    .stat .v.lime { color: var(--lime); }
    .stat .v.amber { color: #f59e0b; }
    .stat .v.red { color: #ef4444; }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .list { display: flex; flex-direction: column; gap: 12px; }
    .card {
      border: 1px solid var(--border); border-radius: 16px;
      background: var(--panel); padding: 16px;
    }
    .card-top {
      display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      margin-bottom: 10px; align-items: center;
    }
    .title { font-weight: 900; font-size: 1.05rem; letter-spacing: -0.02em; }
    .badge {
      font-size: 10px; font-weight: 800; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 4px 8px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted);
    }
    .badge.on { color: var(--lime); border-color: rgba(201,242,35,0.35); background: rgba(201,242,35,0.08); }
    .mini-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 8px; margin: 12px 0;
    }
    .mini {
      border: 1px solid var(--border); border-radius: 12px; padding: 10px;
      background: rgba(255,255,255,0.02);
    }
    .mini .l { font-size: 9px; color: var(--muted); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .mini .v { margin-top: 4px; font-weight: 800; }
    .mini .v.lime { color: var(--lime); }
    .step-box {
      border: 1px solid var(--border); border-radius: 12px; padding: 12px;
      margin-top: 8px; background: rgba(0,0,0,0.25);
    }
    .step-box .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag-arbi {
      background: rgba(201,242,35,0.12); color: var(--lime);
      border: 1px solid rgba(201,242,35,0.3); border-radius: 8px;
      padding: 4px 8px; font-size: 10px; font-weight: 800;
    }
    .tag-casa {
      background: rgba(59,130,246,0.12); color: #93c5fd;
      border: 1px solid rgba(59,130,246,0.3); border-radius: 8px;
      padding: 4px 8px; font-size: 10px; font-weight: 800;
    }
    .card-actions {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 14px;
    }
    .steps { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .empty, .error, .loading {
      border: 1px dashed var(--border); border-radius: 16px;
      padding: 28px; text-align: center; color: var(--muted);
    }
    .error { border-color: rgba(239,68,68,0.4); color: #fca5a5; }
    .suggest {
      display: none;
      margin-bottom: 18px;
      border: 1px solid rgba(201,242,35,0.35);
      border-radius: 16px;
      background: rgba(201,242,35,0.06);
      padding: 16px;
    }
    .suggest.show { display: block; }
    .suggest h2 {
      margin: 0 0 8px;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--lime);
    }
    .suggest .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .suggest .k {
      font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); font-weight: 700;
    }
    .suggest .v { font-weight: 700; margin-top: 2px; word-break: break-word; }
    .suggest .hint { color: var(--muted); font-size: 13px; margin: 0 0 4px; }
    .suggest .actions { margin-top: 14px; }
  </style>
</head>
<body data-shell="admin" data-active="desafios">
  <div class="wrap">
    <header>
      <div>
        <h1>Gestão de <span>Desafios</span></h1>
        <p class="sub">Cockpit de Desafios ArbiShield</p>
      </div>
      <div class="actions">
        <a class="btn btn-primary" href="/admin-desafio-lancar.html" id="btnLaunch">⚡ Lançar Desafio</a>
        <button class="btn btn-ghost" id="btnRefresh" type="button">Atualizar</button>
      </div>
    </header>

    <section class="suggest" id="suggestPanel" aria-live="polite">
      <h2>Sugestão pronta para lançamento</h2>
      <p class="hint">Clique em “Usar no formulário” para abrir a página de lançamento com estes dados.</p>
      <div class="grid" id="suggestGrid"></div>
      <div class="actions">
        <a class="btn btn-lime-outline" id="suggestBetbra" href="#" target="_blank" rel="noopener">Abrir BetBra</a>
        <button class="btn btn-ghost" id="suggestClear" type="button">Descartar sugestão</button>
        <button class="btn btn-primary" id="suggestUse" type="button">Usar no formulário</button>
      </div>
    </section>

    <div class="stats" id="stats"></div>
    <div class="filters">
      <button type="button" class="tab is-on" data-f="all">Todos</button>
      <button type="button" class="tab" data-f="active">Ativos</button>
      <button type="button" class="tab" data-f="draft">Rascunhos</button>
      <button type="button" class="tab" data-f="pending">Pendente</button>
      <input id="search" type="search" placeholder="Buscar desafio ou jogo" />
    </div>
    <div class="meta" id="meta">Carregando…</div>
    <div class="list" id="list"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const DRAFT_KEY = "arbishield_desafio_launch_draft";
    const money = (c) =>
      c == null ? "—" : (Number(c) / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

    function centsToReaisInput(c) {
      if (c == null || c === "" || Number.isNaN(Number(c))) return "";
      return (Number(c) / 100).toLocaleString("pt-BR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    }

    function emptyStep(i) {
      return {
        step_index: i,
        match_label: "",
        league_name: "",
        market_name_arbishield: "",
        market_name_casa: "",
        home_team: "",
        away_team: "",
        home_logo_url: "",
        away_logo_url: "",
        arbi_team_name: "",
        arbi_odd: "",
        casa_team_name: "",
        casa_odd: "",
        casa_stake_cents: "",
        arbi_commission_pct: "0",
        casa_commission_pct: "4.5",
        external_bet_link: "",
        liquidity_cents: "",
        display_liquidity_cents: "",
        starts_at: "",
        release_minutes_before: 60,
        status: "pending",
      };
    }

    function emptyDraft() {
      return {
        target_profit_pct: 5,
        is_active: true,
        append_to_desafio_id: null,
        steps: [emptyStep(1)],
      };
    }

    function goLaunch(prefill) {
      try {
        sessionStorage.setItem(DRAFT_KEY, JSON.stringify(prefill || emptyDraft()));
      } catch {}
      location.href = "/admin-desafio-lancar.html";
    }

    function stepState(step) {
      if (!step?.starts_at) return "upcoming";
      if (step.status === "done" || step.status === "current") return step.status === "done" ? "done" : "live";
      const u = new Date(step.starts_at).getTime();
      const end = u + 9000 * 1000;
      const now = Date.now();
      if (now >= end) return "pending";
      if (now >= u) return "live";
      return "upcoming";
    }

    function totals(rows) {
      const alive = rows.filter((x) => !x.deleted_at);
      const steps = alive.flatMap((x) => x.desafio_steps || []);
      const closed = (x) => {
        const s = x.desafio_steps || [];
        return s.length > 0 && s.every((e) => e.status === "done");
      };
      return {
        total: alive.length,
        active: alive.filter((x) => x.is_active).length,
        drafts: alive.filter((x) => !x.is_active && !closed(x)).length,
        upcoming: steps.filter((x) => stepState(x) === "upcoming").length,
        live: steps.filter((x) => stepState(x) === "live").length,
        pending: steps.filter((x) => stepState(x) === "pending").length,
        closed: alive.filter(closed).length,
        deleted: rows.filter((x) => x.deleted_at).length,
      };
    }

    function renderStats(t) {
      const items = [
        ["Total", t.total, ""],
        ["Ativos", t.active, "lime"],
        ["Rascunhos", t.drafts, ""],
        ["Agendadas", t.upcoming, ""],
        ["Ao Vivo", t.live, "red"],
        ["Pendente", t.pending, "amber"],
        ["Encerrados", t.closed, "lime"],
        ["Excluídos", t.deleted, "red"],
      ];
      $("stats").innerHTML = items
        .map(
          ([l, v, c]) =>
            `<div class="stat"><div class="l">${l}</div><div class="v ${c}">${v}</div></div>`
        )
        .join("");
    }

    function toLocalInput(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function esc(v) {
      return String(v ?? "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    function suggestionToDraft(data) {
      const step = (data.steps && data.steps[0]) || data.step || {};
      const arbiName = step.market_name_arbishield || step.arbi_team_name || "";
      const casaName = step.market_name_casa || step.market_name || step.casa_team_name || "";
      return {
        target_profit_pct: Number(data.target_profit_pct) || 5,
        append_to_desafio_id: null,
        is_active: data.is_active !== false,
        steps: [
          {
            ...emptyStep(1),
            match_label:
              step.match_label ||
              [step.home_team, step.away_team].filter(Boolean).join(" x ") ||
              "",
            league_name: step.league_name || "",
            home_team: step.home_team || "",
            away_team: step.away_team || "",
            home_logo_url: step.home_logo_url || step.home_logo || "",
            away_logo_url: step.away_logo_url || step.away_logo || "",
            arbi_team_name: arbiName,
            arbi_odd: step.arbi_odd != null ? String(step.arbi_odd) : "",
            market_name_arbishield: step.market_name_arbishield || arbiName,
            arbi_commission_pct:
              step.arbi_commission_pct != null ? String(step.arbi_commission_pct) : "0",
            casa_team_name: casaName,
            casa_odd: step.casa_odd != null ? String(step.casa_odd) : "",
            market_name_casa: step.market_name_casa || casaName,
            casa_commission_pct:
              step.casa_commission_pct != null ? String(step.casa_commission_pct) : "4.5",
            casa_stake_cents: centsToReaisInput(step.casa_stake_cents),
            external_bet_link: step.external_bet_link || data.betbraLink || "",
            liquidity_cents: centsToReaisInput(step.liquidity_cents),
            display_liquidity_cents: centsToReaisInput(
              step.display_liquidity_cents ?? step.liquidity_cents
            ),
            starts_at: toLocalInput(step.starts_at),
            release_minutes_before: step.release_minutes_before ?? 30,
            status: step.status || "pending",
          },
        ],
      };
    }

    function render(rows) {
      const t = totals(rows);
      renderStats(t);
      const filter = window.__desafioFilter || "all";
      const q = (window.__desafioQ || "").trim().toLowerCase();
      let visible = rows
        .filter((x) => !x.deleted_at)
        .sort((a, b) => {
          const ta = new Date(a.updated_at || a.created_at || 0).getTime();
          const tb = new Date(b.updated_at || b.created_at || 0).getTime();
          return tb - ta;
        });
      if (filter === "active") visible = visible.filter((x) => x.is_active);
      if (filter === "draft") visible = visible.filter((x) => !x.is_active);
      if (filter === "pending") {
        visible = visible.filter((x) =>
          (x.desafio_steps || []).some((s) => stepState(s) === "pending")
        );
      }
      if (q) {
        visible = visible.filter((d) => {
          const hay = [
            d.title,
            d.number,
            ...(d.desafio_steps || []).map(
              (s) =>
                (s.match_label || "") +
                " " +
                (s.home_team || "") +
                " " +
                (s.away_team || "")
            ),
          ]
            .join(" ")
            .toLowerCase();
          return hay.includes(q);
        });
      }
      $("meta").textContent = `${visible.length} desafio(s) · filtro ${filter}`;
      if (!visible.length) {
        $("list").innerHTML = `<div class="empty">Nenhum desafio encontrado.</div>`;
        return;
      }
      $("list").innerHTML = visible
        .map((d) => {
          const steps = (d.desafio_steps || [])
            .slice()
            .sort((a, b) => a.step_index - b.step_index);
          const stepBlocks = steps
            .map((s) => {
              const label =
                s.match_label ||
                [s.home_team, s.away_team].filter(Boolean).join(" x ") ||
                "—";
              const st = stepState(s);
              const done = st === "done" || s.status === "done";
              const settle = done
                ? `<div class="tags"><span class="tag-arbi">Encerrada · ${
                    s.result === "zebra_protected"
                      ? "Bateu ArbiShield"
                      : s.result === "win"
                        ? "Bateu Casa"
                        : esc(s.result || "done")
                  }</span></div>`
                : `<div class="card-actions" style="margin-top:8px">
                    <button class="btn btn-primary" type="button" data-settle="${esc(s.id)}" data-side="arbishield">Bateu ArbiShield</button>
                    <button class="btn btn-ghost" type="button" data-settle="${esc(s.id)}" data-side="casa">Bateu Casa</button>
                  </div>
                  <p style="margin:6px 0 0;font-size:10px;color:var(--muted)">Circuito: vitórias só na ArbiShield até o fim → ganhos vão aos provedores de liquidez.</p>`;
              return `<div class="step-box">
                <strong>Jogo ${s.step_index}</strong> · ${label}
                <div class="tags">
                  <span class="tag-arbi">Arbi: ${s.market_name_arbishield || s.market_name || "—"} @ ${s.arbi_odd ?? "—"}</span>
                  <span class="tag-casa">Casa: ${s.market_name_casa || "—"} @ ${s.casa_odd ?? "—"}</span>
                </div>
                ${settle}
              </div>`;
            })
            .join("");
          const live = steps.filter((s) => stepState(s) === "live").length;
          const pending = steps.filter((s) => stepState(s) === "pending").length;
          const upcoming = steps.filter((s) => stepState(s) === "upcoming").length;
          const circuitMax = Number(d.total_steps) || Math.max(steps.length, 5);
          const canAppend =
            Boolean(d.is_active) && !d.deleted_at && steps.length < circuitMax;
          return `<article class="card">
            <div class="card-top">
              <div class="title">${esc((steps[0] && (steps[0].match_label || [steps[0].home_team, steps[0].away_team].filter(Boolean).join(" x "))) || d.title || "Desafio")}</div>
              <span class="badge ${d.is_active ? "on" : ""}">${d.is_active ? "Ativo · Publicado" : "Rascunho"}</span>
            </div>
            <div class="steps">${esc(d.subtitle || "Saldo na carteira Desafio · etapas avançam por cliente")}</div>
            <div class="mini-grid">
              <div class="mini"><div class="l">Jogos lançados</div><div class="v">${steps.length}</div></div>
              <div class="mini"><div class="l">Circuito até</div><div class="v">${circuitMax}</div></div>
              <div class="mini"><div class="l">Agendadas</div><div class="v">${upcoming}</div></div>
              <div class="mini"><div class="l">Ao Vivo</div><div class="v ${live ? "lime" : ""}">${live}</div></div>
              <div class="mini"><div class="l">Pendente</div><div class="v">${pending}</div></div>
              <div class="mini"><div class="l">Lucro líquido</div><div class="v lime">${Number(d.target_profit_pct) || 5}%</div></div>
            </div>
            ${stepBlocks || '<div class="steps">Sem jogos</div>'}
            <div class="card-actions">
              ${
                canAppend
                  ? `<button class="btn btn-primary" type="button" data-next-game="${esc(d.id)}">Lançar próximo jogo</button>`
                  : ""
              }
              <button class="btn btn-ghost" type="button" data-clone="${esc(d.id)}">Usar como base</button>
            </div>
          </article>`;
        })
        .join("");

      $("list").querySelectorAll("[data-next-game]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-next-game");
          const d = rows.find((x) => String(x.id) === String(id));
          if (!d) return;
          goLaunch({
            ...emptyDraft(),
            target_profit_pct: Number(d.target_profit_pct) || 5,
            is_active: true,
            append_to_desafio_id: d.id,
            steps: [emptyStep(1)],
          });
        });
      });

      $("list").querySelectorAll("[data-settle]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const stepId = btn.getAttribute("data-settle");
          const winningSide = btn.getAttribute("data-side");
          if (!stepId || !winningSide) return;
          if (
            !confirm(
              winningSide === "arbishield"
                ? "Encerrar etapa: Bateu ArbiShield (zebra / falha na casa)?"
                : "Encerrar etapa: Bateu na Casa (objetivo do circuito)?"
            )
          ) {
            return;
          }
          btn.disabled = true;
          try {
            const session = await ArbiV2.client().auth.getSession();
            const token = session.data.session?.access_token;
            const res = await fetch("/api/arbishield/desafio-settle", {
              method: "POST",
              headers: {
                Authorization: "Bearer " + token,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ stepId, winningSide }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || "Falha ao encerrar");
            const forfeits = (data.forfeits || []).filter((f) => f.forfeited);
            alert(
              "Etapa encerrada." +
                (forfeits.length
                  ? `\n${forfeits.length} circuito(s) liquidados para provedores.`
                  : "")
            );
            await load();
          } catch (err) {
            alert(err.message || "Erro ao encerrar etapa");
            btn.disabled = false;
          }
        });
      });

      $("list").querySelectorAll("[data-clone]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clone");
          const row = (window.__desafioRows || []).find((x) => String(x.id) === String(id));
          if (!row) return;
          const first = (row.desafio_steps || [])
            .slice()
            .sort((a, b) => a.step_index - b.step_index)[0];
          const s = first || {};
          goLaunch({
            ...emptyDraft(),
            target_profit_pct: Number(row.target_profit_pct) || 5,
            append_to_desafio_id: null,
            is_active: true,
            steps: [
              {
                ...emptyStep(1),
                match_label: s.match_label || "",
                league_name: s.league_name || "",
                home_team: s.home_team || "",
                away_team: s.away_team || "",
                home_logo_url: s.home_logo_url || s.home_logo || "",
                away_logo_url: s.away_logo_url || s.away_logo || "",
                arbi_team_name: s.arbi_team_name || s.market_name_arbishield || "",
                arbi_odd: s.arbi_odd != null ? String(s.arbi_odd) : "",
                market_name_arbishield: s.market_name_arbishield || "",
                arbi_commission_pct:
                  s.arbi_commission_pct != null ? String(s.arbi_commission_pct) : "0",
                casa_team_name: s.casa_team_name || s.market_name_casa || "",
                casa_odd: s.casa_odd != null ? String(s.casa_odd) : "",
                market_name_casa: s.market_name_casa || "",
                casa_commission_pct:
                  s.casa_commission_pct != null ? String(s.casa_commission_pct) : "4.5",
                casa_stake_cents: centsToReaisInput(s.casa_stake_cents),
                external_bet_link: s.external_bet_link || "",
                liquidity_cents: centsToReaisInput(s.liquidity_cents),
                display_liquidity_cents: centsToReaisInput(
                  s.display_liquidity_cents ?? s.liquidity_cents
                ),
                starts_at: toLocalInput(s.starts_at),
                release_minutes_before: s.release_minutes_before ?? 60,
                status: "pending",
              },
            ],
          });
        });
      });
    }

    async function load() {
      $("list").innerHTML = `<div class="loading">Carregando desafios…</div>`;
      $("meta").textContent = "Buscando…";
      try {
        const res = await fetch("/api/arbishield/desafios", {
          cache: "no-store",
          headers: { accept: "application/json" },
        });
        const text = await res.text();
        let data;
        try {
          data = text ? JSON.parse(text) : null;
        } catch {
          throw new Error("Resposta inválida (" + res.status + ")");
        }
        if (!res.ok) throw new Error((data && data.error) || "HTTP " + res.status);
        if (!Array.isArray(data)) throw new Error("Resposta inválida da API");
        window.__desafioRows = data;
        render(data);
      } catch (err) {
        $("stats").innerHTML = "";
        $("meta").textContent = "";
        $("list").innerHTML = `<div class="error">${String(err.message || err)}</div>`;
      }
    }

    window.__desafioFilter = "all";
    window.__desafioQ = "";
    document.querySelectorAll(".filters .tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filters .tab").forEach((b) => b.classList.remove("is-on"));
        btn.classList.add("is-on");
        window.__desafioFilter = btn.getAttribute("data-f") || "all";
        if (window.__desafioRows) render(window.__desafioRows);
      });
    });
    const searchEl = $("search");
    if (searchEl) {
      searchEl.addEventListener("input", () => {
        window.__desafioQ = searchEl.value || "";
        if (window.__desafioRows) render(window.__desafioRows);
      });
    }

    function readSuggestion() {
      const want =
        new URLSearchParams(location.search).get("sugestao") === "1" ||
        Boolean(localStorage.getItem("arbishield_desafio_suggestion"));
      if (!want) return null;
      const raw = localStorage.getItem("arbishield_desafio_suggestion");
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function clearSuggestionQuery() {
      try {
        const u = new URL(location.href);
        if (u.searchParams.has("sugestao")) {
          u.searchParams.delete("sugestao");
          history.replaceState({}, "", u.pathname + u.search);
        }
      } catch {}
    }

    function renderSuggestion() {
      const data = readSuggestion();
      const panel = $("suggestPanel");
      if (!data) {
        panel.classList.remove("show");
        return;
      }
      const step = (data.steps && data.steps[0]) || data.step || {};
      const rows = [
        ["Partida", step.match_label || [step.home_team, step.away_team].filter(Boolean).join(" x ")],
        ["Mercado casa", step.market_name_casa || step.market_name],
        ["Odd casa", step.casa_odd],
        ["Mercado Arbi", step.market_name_arbishield],
        ["Odd Arbi", step.arbi_odd],
        ["Stake casa", money(step.casa_stake_cents)],
        ["Lucro líquido", (data.target_profit_pct != null ? data.target_profit_pct + "%" : "")],
        ["Liquidez", money(step.liquidity_cents)],
        ["Início", step.starts_at],
      ];
      $("suggestGrid").innerHTML = rows
        .filter(([, v]) => v != null && v !== "")
        .map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`)
        .join("");
      const link = step.external_bet_link || data.betbraLink || "#";
      const a = $("suggestBetbra");
      a.href = link;
      a.style.display = link && link !== "#" ? "inline-flex" : "none";
      panel.classList.add("show");
      clearSuggestionQuery();
    }

    $("suggestClear").addEventListener("click", () => {
      localStorage.removeItem("arbishield_desafio_suggestion");
      localStorage.removeItem("arbishield_desafio_suggestion_at");
      renderSuggestion();
    });

    $("suggestUse").addEventListener("click", () => {
      const data = readSuggestion();
      if (!data) return;
      goLaunch(suggestionToDraft(data));
    });

    $("btnRefresh").addEventListener("click", load);
    renderSuggestion();

    if (new URLSearchParams(location.search).get("lancar") === "1") {
      location.replace("/admin-desafio-lancar.html");
    } else if (new URLSearchParams(location.search).get("sugestao") === "1" && readSuggestion()) {
      goLaunch(suggestionToDraft(readSuggestion()));
    } else {
      load();
    }
  </script>
</body>
</html>
