<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Monitor de Proteções — ArbiShield</title>
  <link rel="icon" type="image/png" href="/brand/favicon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/v2.css?v=15" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="/v2.js?v=15"></script>
  <script src="/v2-shell.js?v=15" defer></script>
  <style>
    .mon-wrap { display: grid; gap: 16px; padding-bottom: 48px; }
    .mon-head h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase; }
    .mon-head h1 span { color: #00ff00; }
    .mon-head .sub { margin: 8px 0 0; color: #8b949e; font-size: 12px; }
    .mon-filters {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      border-radius: 16px; border: 1px solid rgba(0,255,0,0.12); background: #071413; padding: 12px;
    }
    .mon-filters input, .mon-filters select {
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
      background: #010b0a; color: #fff; padding: 10px 12px; font-size: 12px; min-width: 140px;
    }
    .mon-filters input[type="search"] { flex: 1; min-width: 200px; }
    .mon-tabs { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
    .mon-tab {
      border: 1px solid rgba(255,255,255,0.08); background: transparent; color: #8b949e;
      border-radius: 999px; padding: 8px 12px; font-size: 10px; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
    }
    .mon-tab.on { background: #00ff00; color: #022c22; border-color: #00ff00; }
    .mon-btn {
      border: 0; border-radius: 12px; background: #00ff00; color: #000;
      padding: 10px 14px; font-size: 10px; font-weight: 800; letter-spacing: 0.1em;
      text-transform: uppercase; cursor: pointer;
    }
    .mon-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .mon-btn.ghost {
      background: transparent; color: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .mon-btn.warn { background: #fbbf24; color: #000; }
    .mon-btn.danger { background: #ef4444; color: #fff; }
    .mon-btn.sm { padding: 8px 10px; font-size: 9px; }
    .mon-kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
    .mon-kpi {
      border-radius: 16px; border: 1px solid rgba(0,255,0,0.12); background: #071413; padding: 14px;
    }
    .mon-kpi .l { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #8b949e; }
    .mon-kpi strong { display: block; margin-top: 8px; font-size: 1.2rem; }
    .mon-list { display: grid; gap: 10px; }
    .mon-row {
      border-radius: 16px; border: 1px solid rgba(0,255,0,0.1); background: #071413; padding: 14px 16px;
    }
    .mon-row-top { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; }
    .mon-league { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #8b949e; }
    .mon-match { margin-top: 4px; font-weight: 800; font-size: 14px; }
    .mon-user {
      margin-top: 8px; font-size: 13px; color: #c8f31d; font-weight: 700;
    }
    .mon-user span { color: #8b949e; font-weight: 600; }
    .mon-meta { margin-top: 6px; font-size: 11px; color: #8b949e; display: flex; flex-wrap: wrap; gap: 8px; }
    .mon-right { text-align: right; display: grid; gap: 8px; justify-items: end; }
    .mon-right .amt { font-size: 1.05rem; font-weight: 800; }
    .mon-badge {
      display: inline-flex; border-radius: 999px; padding: 3px 8px;
      font-size: 9px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.12); color: #8b949e;
    }
    .mon-badge.live { color: #f87171; border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.08); }
    .mon-badge.active { color: #00ff00; border-color: rgba(0,255,0,0.35); background: rgba(0,255,0,0.08); }
    .mon-badge.pending { color: #fbbf24; border-color: rgba(251,191,36,0.35); background: rgba(251,191,36,0.08); }
    .mon-badge.done { color: #34d399; border-color: rgba(52,211,153,0.35); background: rgba(52,211,153,0.08); }
    .mon-badge.sched { color: #60a5fa; border-color: rgba(96,165,250,0.35); background: rgba(96,165,250,0.08); }
    .mon-badge.canc { color: #a1a1aa; }
    .mon-details {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06);
      display: grid; gap: 10px;
    }
    .mon-details-grid {
      display: grid; grid-template-columns: minmax(160px, 1.6fr) repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 12px;
    }
    .mon-details-grid .l { color: #8b949e; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
    .mon-details-grid .mon-market-val {
      display: block; margin-top: 4px; font-size: 13px; font-weight: 800; line-height: 1.35;
      color: #fff; white-space: normal; overflow-wrap: anywhere;
    }
    .mon-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .mon-empty { text-align: center; color: #8b949e; padding: 36px 12px; font-size: 13px; }
    .mon-alert { border-radius: 12px; padding: 10px 12px; font-size: 12px; }
    .mon-alert.ok { background: rgba(0,255,0,0.08); border: 1px solid rgba(0,255,0,0.3); color: #00ff00; }
    .mon-alert.bad { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.35); color: #f87171; }
    @media (max-width: 900px) {
      .mon-kpis, .mon-details-grid { grid-template-columns: 1fr 1fr; }
      .mon-right { text-align: left; justify-items: start; width: 100%; }
    }
    @media (max-width: 560px) {
      .mon-kpis, .mon-details-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-shell="admin" data-active="monitoring-protections">
  <div id="err" class="err"></div>
  <div id="monRoot" class="mon-wrap"><div class="mon-empty">Carregando…</div></div>
  <script>
(function () {
  var TABS = [
    ["open", "Em aberto"],
    ["pending", "Pendentes (comprovante)"],
    ["live", "Ao vivo"],
    ["scheduled", "Agendado"],
    ["closed", "Encerrado"],
    ["cancelled", "Canceladas"],
    ["all", "Todos"],
  ];

  var state = {
    tab: "open",
    q: "",
    day: "",
    rows: [],
    openId: null,
    busy: false,
    err: "",
    ok: "",
  };

  function money(c) { return ArbiV2.money(c); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  }
  function showErr(msg) {
    var el = document.getElementById("err");
    if (!el) return;
    el.textContent = msg || "";
    el.classList.toggle("show", !!msg);
  }
  async function authToken(supa) {
    var s = await supa.auth.getSession();
    return s.data.session && s.data.session.access_token;
  }

  function isClosedStatus(st) {
    st = String(st || "").toLowerCase();
    return (
      st === "settled" ||
      st === "closed" ||
      st === "finished" ||
      st.indexOf("won_") === 0 ||
      st.indexOf("lost_") === 0
    );
  }
  function isOpenStatus(st) {
    st = String(st || "").toLowerCase();
    return st === "active" || st === "pending" || st === "review_odd";
  }
  function matchPhase(row, now) {
    var ms = row.matchStatus ? String(row.matchStatus).toLowerCase() : "";
    if (ms === "live" || ms === "in_progress") return "live";
    if (ms === "finished" || ms === "closed" || ms === "settled") return "ended";
    if (row.startsAt) {
      var t = new Date(row.startsAt).getTime();
      if (Number.isFinite(t)) {
        if (t > now) return "scheduled";
        return "live";
      }
    }
    return "unknown";
  }
  function bucket(row, now) {
    var st = String(row.status || "").toLowerCase();
    if (st === "cancelled") return "cancelled";
    if (isClosedStatus(st)) return "closed";
    var phase = matchPhase(row, now);
    if (st === "pending" || st === "review_odd") return "pending";
    if (phase === "live") return "live";
    if (phase === "scheduled") return "scheduled";
    if (isOpenStatus(st)) return "open";
    return "all";
  }
  function badgeFor(row, now) {
    var b = bucket(row, now);
    if (b === "live") return ["live", "Ao vivo"];
    if (b === "pending") return ["pending", "Pendente"];
    if (b === "scheduled") return ["sched", "Agendado"];
    if (b === "closed") return ["done", "Encerrado"];
    if (b === "cancelled") return ["canc", "Cancelada"];
    return ["active", String(row.status || "Ativa")];
  }

  function filtered() {
    var now = Date.now();
    var q = String(state.q || "").trim().toLowerCase();
    return (state.rows || []).filter(function (r) {
      if (state.day) {
        var d = (r.createdAt || "").slice(0, 10);
        if (d !== state.day) return false;
      }
      if (state.tab !== "all") {
        var b = bucket(r, now);
        if (state.tab === "open") {
          if (!(b === "open" || b === "pending" || b === "live" || b === "scheduled")) return false;
        } else if (b !== state.tab) return false;
      }
      if (q) {
        var hay = [r.userName, r.userId, r.home, r.away, r.league, r.marketName, r.id, r.status]
          .join(" ")
          .toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function tabCount(tabKey) {
    var now = Date.now();
    var n = 0;
    (state.rows || []).forEach(function (r) {
      var b = bucket(r, now);
      if (tabKey === "all") n += 1;
      else if (tabKey === "open") {
        if (b === "open" || b === "pending" || b === "live" || b === "scheduled") n += 1;
      } else if (b === tabKey) n += 1;
    });
    return n;
  }

  function paint() {
    var root = document.getElementById("monRoot");
    if (!root) return;
    var now = Date.now();
    var rows = filtered();
    // KPIs da aba atual — evita mostrar valor protegido com lista vazia
    var vol = rows.reduce(function (a, r) {
      return a + Number(r.amountCents || 0);
    }, 0);
    var avg = rows.length ? Math.round(vol / rows.length) : 0;
    var cancelled = (state.rows || []).filter(function (r) {
      return String(r.status).toLowerCase() === "cancelled";
    }).length;
    var openAll = tabCount("open");

    root.innerHTML =
      '<header class="mon-head"><div><h1>Monitor de <span>Proteções &amp; Liquidação</span></h1>' +
      '<p class="sub">Veja quem entrou, filtre por status e encerre ou estorne operações.</p></div></header>' +
      (state.err ? '<div class="mon-alert bad">' + esc(state.err) + "</div>" : "") +
      (state.ok ? '<div class="mon-alert ok">' + esc(state.ok) + "</div>" : "") +
      '<section class="mon-filters">' +
      '<div class="mon-tabs">' +
      TABS.map(function (t) {
        var cnt = tabCount(t[0]);
        return (
          '<button type="button" class="mon-tab' +
          (state.tab === t[0] ? " on" : "") +
          '" data-tab="' +
          t[0] +
          '">' +
          t[1] +
          " (" +
          cnt +
          ")</button>"
        );
      }).join("") +
      "</div>" +
      '<input id="monQ" type="search" placeholder="Busque pelo nome do usuário ou jogo" value="' +
      esc(state.q) +
      '" />' +
      '<input id="monDay" type="date" value="' +
      esc(state.day) +
      '" />' +
      '<button type="button" class="mon-btn" id="monReload">Atualizar</button>' +
      "</section>" +
      '<section class="mon-kpis">' +
      '<article class="mon-kpi"><span class="l">Total operações (aba)</span><strong>' +
      rows.length +
      "</strong></article>" +
      '<article class="mon-kpi"><span class="l">Total em proteção (aba)</span><strong>' +
      esc(money(vol)) +
      "</strong></article>" +
      '<article class="mon-kpi"><span class="l">Média de proteção</span><strong>' +
      esc(money(avg)) +
      "</strong></article>" +
      '<article class="mon-kpi"><span class="l">Canceladas (geral)</span><strong>' +
      cancelled +
      "</strong></article></section>" +
      (state.tab === "pending" && !rows.length
        ? '<div class="mon-alert" style="background:#1a1a12;border:1px solid #3a3a20;color:#d4d4aa;margin-bottom:12px">' +
          "Pendentes = aguardando comprovante (<code>pending</code>). " +
          "O valor protegido das operações ativas está em <strong>Em aberto" +
          (openAll ? " (" + openAll + ")" : "") +
          "</strong>.</div>"
        : "") +
      '<section class="mon-list">' +
      (rows.length
        ? rows
            .map(function (r) {
              var badge = badgeFor(r, now);
              var open = state.openId === r.id;
              var canAct = isOpenStatus(r.status);
              return (
                '<article class="mon-row" data-id="' +
                esc(r.id) +
                '">' +
                '<div class="mon-row-top">' +
                "<div>" +
                '<div class="mon-league">' +
                esc(r.league || "Sem liga") +
                " · " +
                esc(String(r.side || "LAY").toUpperCase()) +
                "</div>" +
                '<div class="mon-match">' +
                esc(r.home || "?") +
                " vs " +
                esc(r.away || "?") +
                "</div>" +
                '<div class="mon-user"><span>Quem entrou:</span> ' +
                esc(r.userName || "Usuário sem nome") +
                "</div>" +
                '<div class="mon-meta">' +
                "<span>" +
                esc(r.createdAt ? new Date(r.createdAt).toLocaleString("pt-BR") : "—") +
                "</span>" +
                (r.odd != null ? "<span>Odd " + esc(r.odd) + "</span>" : "") +
                (r.startsAt
                  ? "<span>Kickoff " +
                    esc(new Date(r.startsAt).toLocaleString("pt-BR")) +
                    "</span>"
                  : "") +
                "</div></div>" +
                '<div class="mon-right">' +
                '<span class="mon-badge ' +
                badge[0] +
                '">' +
                esc(badge[1]) +
                "</span>" +
                '<div class="amt">' +
                esc(money(r.amountCents)) +
                "</div>" +
                '<button type="button" class="mon-btn ghost sm" data-toggle="' +
                esc(r.id) +
                '">' +
                (open ? "Ocultar" : "Ver detalhes") +
                "</button></div></div>" +
                (open
                  ? '<div class="mon-details">' +
                    '<div class="mon-details-grid">' +
                    '<div><div class="l">Mercado</div><strong class="mon-market-val">' +
                    esc(r.marketName || "—") +
                    "</strong></div>" +
                    '<div><div class="l">Usuário</div><strong>' +
                    esc(r.userName || "—") +
                    "</strong></div>" +
                    '<div><div class="l">ID proteção</div><strong style="font-size:11px">' +
                    esc(r.id) +
                    "</strong></div>" +
                    '<div><div class="l">Lucro usuário</div><strong>' +
                    esc(money(r.userProfitCents)) +
                    "</strong></div>" +
                    '<div><div class="l">Status DB</div><strong>' +
                    esc(r.status) +
                    "</strong></div>" +
                    '<div><div class="l">LAY/BACK</div><strong>' +
                    esc(r.marketType || "LAY") +
                    "</strong></div></div>" +
                    (canAct
                      ? '<div class="mon-actions">' +
                        '<button type="button" class="mon-btn warn sm" data-close="' +
                        esc(r.id) +
                        '" data-mkt="' +
                        esc(r.marketType) +
                        '"' +
                        (state.busy ? " disabled" : "") +
                        ">Encerrar (sem estorno)</button>" +
                        '<button type="button" class="mon-btn danger sm" data-cancel="' +
                        esc(r.id) +
                        '" data-mkt="' +
                        esc(r.marketType) +
                        '"' +
                        (state.busy ? " disabled" : "") +
                        ">Cancelar e estornar</button>" +
                        "</div>" +
                        '<p style="margin:0;font-size:11px;color:#8b949e">Encerrar: fecha a operação e devolve liquidez ao jogo (saldo do usuário não volta). Cancelar: estorna o valor ao usuário.</p>'
                      : '<p style="margin:0;font-size:12px;color:#8b949e">Operação já finalizada — sem ações de encerramento.</p>') +
                    "</div>"
                  : "") +
                "</article>"
              );
            })
            .join("")
        : '<div class="mon-empty">' +
          (state.tab === "pending"
            ? "Nenhuma pendente (aguardando comprovante). As operações ativas com valor protegido estão em Em aberto."
            : "Nenhuma proteção neste filtro. Troque a aba (Em aberto / Ao vivo / Encerrado / Agendado) ou limpe a busca.") +
          "</div>") +
      "</section>";

    bind(root);
  }

  function bind(root) {
    root.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.tab = btn.getAttribute("data-tab");
        state.openId = null;
        paint();
      });
    });
    var q = document.getElementById("monQ");
    if (q) {
      q.addEventListener("change", function () {
        state.q = q.value;
        paint();
      });
      q.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") {
          state.q = q.value;
          paint();
        }
      });
    }
    var day = document.getElementById("monDay");
    if (day) {
      day.addEventListener("change", function () {
        state.day = day.value;
        paint();
      });
    }
    var reload = document.getElementById("monReload");
    if (reload) {
      reload.addEventListener("click", function () {
        load().catch(function (ex) {
          state.err = ex.message || "Erro";
          paint();
        });
      });
    }
    root.querySelectorAll("[data-toggle]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-toggle");
        state.openId = state.openId === id ? null : id;
        paint();
      });
    });
    root.querySelectorAll("[data-close]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        actClose(btn.getAttribute("data-close"), btn.getAttribute("data-mkt"));
      });
    });
    root.querySelectorAll("[data-cancel]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        actCancel(btn.getAttribute("data-cancel"), btn.getAttribute("data-mkt"));
      });
    });
  }

  function marketNameFrom(r) {
    var meta = r && r.metadata && typeof r.metadata === "object" ? r.metadata : {};
    var name =
      meta.market_name ||
      meta.marketName ||
      meta.runner_name ||
      meta.runnerName ||
      r.market_name ||
      r.marketName ||
      "";
    if (name && String(name).trim()) return String(name).trim();
    var displayOdd = displayOddOf(r);
    if (displayOdd != null && Number(displayOdd) > 0) {
      return "Odd " + Number(displayOdd).toFixed(2);
    }
    return "";
  }

  /** Odd do mercado lançado (LAY 30 → 30). Não usar back-equivalente. */
  function displayOddOf(r) {
    var meta = r && r.metadata && typeof r.metadata === "object" ? r.metadata : {};
    var marketOdd = Number(meta.market_odd);
    if (marketOdd > 1.01) return marketOdd;
    var o = Number(r && r.odd);
    return o > 0 ? o : null;
  }

  async function loadFromView(supa) {
    var res = await supa
      .from("view_all_protections")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(500);
    if (res.error) throw res.error;
    return (res.data || []).map(function (r) {
      return {
        id: r.id,
        userId: r.user_id,
        userName: r.user_full_name || "Sem nome",
        matchId: r.match_id,
        home: r.home_team,
        away: r.away_team,
        league: r.league,
        matchStatus: r.match_status,
        startsAt: r.starts_at || null,
        status: r.status,
        side: r.side || r.market_category || "LAY",
        marketType:
          String(r.market_category || r.side || "LAY").toUpperCase() === "BACK"
            ? "BACK"
            : "LAY",
        marketName: marketNameFrom(r),
        odd: displayOddOf(r),
        amountCents: Number(r.responsibility_cents || r.amount_cents || 0),
        userProfitCents: Number(r.user_profit_cents || 0),
        createdAt: r.created_at,
      };
    });
  }

  async function loadFallback(supa) {
    var res = await supa
      .from("protections")
      .select(
        "id,user_id,match_id,status,amount_cents,responsibility_cents,user_profit_cents,created_at,side,odd,market_category,metadata"
      )
      .order("created_at", { ascending: false })
      .limit(400);
    if (res.error) throw res.error;
    var rows = res.data || [];
    var back = await supa
      .from("back_protections")
      .select(
        "id,user_id,match_id,status,amount_cents,user_profit_cents,created_at,odd,metadata"
      )
      .order("created_at", { ascending: false })
      .limit(200);
    (back.data || []).forEach(function (r) {
      rows.push(
        Object.assign({}, r, {
          side: "BACK",
          market_category: "BACK",
          responsibility_cents: r.amount_cents,
        })
      );
    });
    var userIds = Array.from(
      new Set(rows.map(function (r) { return r.user_id; }).filter(Boolean))
    );
    var matchIds = Array.from(
      new Set(rows.map(function (r) { return r.match_id; }).filter(Boolean))
    );
    var names = {};
    var matches = {};
    if (userIds.length) {
      var pr = await supa.from("profiles").select("id,full_name").in("id", userIds);
      (pr.data || []).forEach(function (p) {
        names[p.id] = p.full_name || "Sem nome";
      });
    }
    if (matchIds.length) {
      var mr = await supa
        .from("matches")
        .select("id,home_team,away_team,league,status,starts_at,markets")
        .in("id", matchIds);
      (mr.data || []).forEach(function (m) {
        matches[m.id] = m;
      });
    }
    return rows.map(function (r) {
      var m = matches[r.match_id] || {};
      var marketName = marketNameFrom(r);
      if (!marketName && Array.isArray(m.markets) && m.markets.length) {
        var meta = r.metadata && typeof r.metadata === "object" ? r.metadata : {};
        var mid = meta.market_id || meta.marketId;
        var mk =
          (mid &&
            m.markets.find(function (x) {
              return String(x.id) === String(mid);
            })) ||
          m.markets[0];
        if (mk && mk.name) marketName = String(mk.name).trim();
      }
      return {
        id: r.id,
        userId: r.user_id,
        userName: names[r.user_id] || "Sem nome",
        matchId: r.match_id,
        home: m.home_team,
        away: m.away_team,
        league: m.league,
        matchStatus: m.status,
        startsAt: m.starts_at || null,
        status: r.status,
        side: r.side || r.market_category || "LAY",
        marketType:
          String(r.market_category || r.side || "LAY").toUpperCase() === "BACK"
            ? "BACK"
            : "LAY",
        marketName: marketName || (displayOddOf(r) != null ? "Odd " + Number(displayOddOf(r)).toFixed(2) : "—"),
        odd: displayOddOf(r),
        amountCents: Number(r.responsibility_cents || r.amount_cents || 0),
        userProfitCents: Number(r.user_profit_cents || 0),
        createdAt: r.created_at,
      };
    });
  }

  async function load() {
    state.err = "";
    state.ok = "";
    paint();
    var supa = ArbiV2.client();
    try {
      state.rows = await loadFromView(supa);
    } catch (e1) {
      state.rows = await loadFallback(supa);
    }
    paint();
  }

  async function actClose(id, marketType) {
    if (state.busy || !id) return;
    var reason = window.prompt(
      "Encerrar SEM estornar saldo.\nInforme o motivo (obrigatório):"
    );
    if (!reason || !String(reason).trim()) {
      state.err = "Motivo é obrigatório para encerrar sem estornar.";
      paint();
      return;
    }
    state.busy = true;
    state.err = "";
    state.ok = "";
    paint();
    try {
      var token = await authToken(ArbiV2.client());
      var res = await fetch("/api/arbishield/protection-close", {
        method: "POST",
        headers: {
          Authorization: "Bearer " + token,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          protectionId: id,
          marketType: marketType || "LAY",
          reason: String(reason).trim(),
        }),
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || "Falha ao encerrar");
      state.ok = "Operação encerrada sem estorno. Liquidez devolvida ao jogo.";
      await load();
    } catch (ex) {
      state.err = (ex && ex.message) || "Erro ao encerrar";
      paint();
    } finally {
      state.busy = false;
    }
  }

  async function actCancel(id, marketType) {
    if (state.busy || !id) return;
    if (
      !window.confirm(
        "ATENÇÃO: cancelar esta operação e ESTORNAR o saldo integral ao usuário?"
      )
    ) {
      return;
    }
    state.busy = true;
    state.err = "";
    state.ok = "";
    paint();
    try {
      var token = await authToken(ArbiV2.client());
      var res = await fetch("/api/arbishield/protection-cancel", {
        method: "POST",
        headers: {
          Authorization: "Bearer " + token,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          protectionId: id,
          marketType: marketType || "LAY",
        }),
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || "Falha ao cancelar");
      state.ok = "Operação cancelada e saldo estornado.";
      await load();
    } catch (ex) {
      state.err = (ex && ex.message) || "Erro ao cancelar";
      paint();
    } finally {
      state.busy = false;
    }
  }

  document.addEventListener("DOMContentLoaded", async function () {
    try {
      var supa = ArbiV2.client();
      var user = await ArbiV2.requireUser(supa);
      if (!user) return;
      if (!(await ArbiV2.requireAdmin(supa, user))) {
        showErr("Sem permissão administrativa");
        return;
      }
      await load();
    } catch (ex) {
      showErr(ex.message || "Erro ao carregar monitor");
    }
  });
})();
  </script>
</body>
</html>
