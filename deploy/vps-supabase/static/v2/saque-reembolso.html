<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Saque Saldo Reembolso — ArbiShield</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg: #0f1410;
      --fg: #e8f0e4;
      --muted: #9aab96;
      --accent: #c8f31d;
      --danger: #f87171;
      --card: #1a221c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #243528 0%, var(--bg) 55%);
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid #2d3b30;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; letter-spacing: -0.02em; }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.45; font-size: .95rem; }
    .bal { font-size: 1.75rem; font-weight: 800; color: var(--accent); margin-bottom: 18px; }
    label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #3a4a3e;
      background: #101610;
      color: var(--fg);
      font-size: 1rem;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px 16px;
      font-weight: 800;
      font-size: .95rem;
      cursor: pointer;
      background: var(--accent);
      color: #132012;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: .9rem; line-height: 1.4; white-space: pre-wrap; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--accent); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Saque — Saldo Reembolso</h1>
    <p>Página temporária (bypass do shim). Use logado em <a href="/app-carteira.html">arbishield.app</a>.</p>
    <div class="bal" id="bal">Carregando…</div>
    <label for="amount">Valor (R$)</label>
    <input id="amount" inputmode="decimal" placeholder="0,00" />
    <button id="btn" type="button">Solicitar saque</button>
    <div class="msg" id="msg"></div>
  </main>
  <script>
    (function () {
      var ANON =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg0NDc5OTk4LCJleHAiOjE5NDIxNTk5OTh9.mxLqs20sCUNn58jWlsD0sznclCOr8rbksjTEAuQee3s";
      var supa = window.supabase.createClient(location.origin, ANON, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          storageKey: "sb-arbishield-auth-token",
        },
      });
      var balEl = document.getElementById("bal");
      var amountEl = document.getElementById("amount");
      var btn = document.getElementById("btn");
      var msg = document.getElementById("msg");
      var available = 0;
      var pix = "";

      function money(cents) {
        return (Number(cents || 0) / 100).toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
        });
      }

      function setMsg(text, ok) {
        msg.className = "msg " + (ok ? "ok" : "err");
        msg.textContent = text || "";
      }

      async function load() {
        var userRes = await supa.auth.getUser();
        if (userRes.error || !userRes.data.user) {
          balEl.textContent = "Faça login";
          setMsg("Sessão não encontrada. Abra /auth.html, entre e volte aqui.");
          btn.disabled = true;
          return;
        }
        var uid = userRes.data.user.id;
        var prof = await supa
          .from("profiles")
          .select("deduction_balance_cents,pix_key")
          .eq("id", uid)
          .maybeSingle();
        if (prof.error) {
          setMsg(prof.error.message || "Erro ao ler perfil");
          btn.disabled = true;
          return;
        }
        available = Number((prof.data && prof.data.deduction_balance_cents) || 0);
        pix = String((prof.data && prof.data.pix_key) || "").trim();
        balEl.textContent = money(available);
        amountEl.value = (available / 100).toFixed(2).replace(".", ",");
        if (!(available > 0)) {
          setMsg("Saldo Reembolso zerado.");
          btn.disabled = true;
        } else if (!pix) {
          setMsg("Cadastre a chave Pix no Perfil antes de sacar.");
          btn.disabled = true;
        }
      }

      btn.addEventListener("click", async function () {
        setMsg("");
        btn.disabled = true;
        try {
          var raw = String(amountEl.value || "").replace(/\./g, "").replace(",", ".");
          var cents = Math.round((parseFloat(raw) || 0) * 100);
          if (!(cents > 0)) throw new Error("Valor inválido");
          if (cents > available) throw new Error("Valor acima do disponível");
          var rpc = await supa.rpc("request_saldo_reembolso_withdrawal", {
            p_amount_cents: cents,
            p_pix_key: pix,
          });
          if (rpc.error) throw new Error(rpc.error.message || "Falha no saque");
          setMsg("Saque solicitado. Aguarde a análise.", true);
          await load();
        } catch (ex) {
          setMsg(ex.message || "Erro");
          btn.disabled = false;
        }
      });

      load();
    })();
  </script>
</body>
</html>
