<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>App — ArbiShield v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/v2/v2.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="/v2/v2.js"></script>
  <script src="/v2/v2-shell.js" defer></script>
</head>
<body data-shell="app" data-active="home">
  <div class="page-head">
    <div>
      <h1>Área do <span>membro</span></h1>
      <p class="sub" id="meta">Carregando…</p>
    </div>
  </div>
  <div id="err" class="err"></div>
  <div class="grid" id="cards"></div>

  <div class="section-label"><span class="dot" style="background:#c9f223"></span>Atalhos</div>
  <div class="grid">
    <a class="card primary" href="/v2/app-modulo.html?to=/app/proteger&t=Proteger%20Aposta"><div class="tag">Operações</div><h2>Proteger aposta</h2><p>Abrir proteção no fluxo do app.</p></a>
    <a class="card" href="/v2/app-modulo.html?to=/app/protecoes&t=Minhas%20Prote%C3%A7%C3%B5es"><div class="tag">Operações</div><h2>Minhas proteções</h2><p>Histórico e status.</p></a>
    <a class="card" href="/v2/app-modulo.html?to=/app/carteira&t=Financeiro"><div class="tag">Operações</div><h2>Financeiro</h2><p>Saldo, depósitos e saques.</p></a>
  </div>

  <script>
    (async function () {
      var supa = ArbiV2.client();
      var user = await ArbiV2.requireUser(supa);
      if (!user) return;

      document.getElementById("meta").textContent =
        (user.email || "—") + " · layout do site legado · banco vivo";

      document.addEventListener("click", async function (e) {
        var t = e.target.closest("#v2LogoutLink");
        if (!t) return;
        e.preventDefault();
        await supa.auth.signOut();
        location.replace("/v2/auth.html");
      });

      try {
        var { data, error } = await supa
          .from("profiles")
          .select("full_name,balance_cents,account_status")
          .eq("id", user.id)
          .maybeSingle();
        if (error) throw error;
        document.getElementById("cards").innerHTML =
          '<div class="card"><strong>Nome</strong><b>' +
          (data && data.full_name ? data.full_name : "—") +
          "</b></div>" +
          '<div class="card"><strong>Saldo</strong><b>' +
          ArbiV2.money(data && data.balance_cents) +
          "</b></div>" +
          '<div class="card"><strong>Status</strong><b style="font-size:1.1rem">' +
          (data && data.account_status ? data.account_status : "—") +
          "</b></div>";
      } catch (ex) {
        var err = document.getElementById("err");
        err.textContent = ex.message || "Erro";
        err.classList.add("show");
      }
    })();
  </script>
</body>
</html>
