<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Entrar — ArbiShield v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/v2/v2.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="/v2/v2.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="/v2/">Arbi<span>Shield</span></a>
    <nav>
      <a href="/v2/auth.html">Entrar</a>
      <a class="cta" href="/v2/app.html">App</a>
    </nav>
  </header>
  <div class="panel">
    <div class="brand" style="font-size:12px;margin-bottom:10px">Arbi<span>Shield</span></div>
    <h1>Entrar</h1>
    <p class="sub">Mesmo Auth / mesmo banco de arbishield.app</p>
    <div id="err" class="err" role="alert"></div>
    <form id="form">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required placeholder="seu@email.com" />
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
      <button class="btn btn-primary btn-block" type="submit" id="btn">Acessar</button>
    </form>
  </div>
  <script>
    (async function () {
      var supa = ArbiV2.client();
      var session = await supa.auth.getSession();
      if (session.data.session) location.replace("/v2/app.html");

      document.getElementById("form").addEventListener("submit", async function (e) {
        e.preventDefault();
        var err = document.getElementById("err");
        var btn = document.getElementById("btn");
        err.classList.remove("show");
        err.textContent = "";
        btn.disabled = true;
        btn.textContent = "Entrando…";
        try {
          var res = await supa.auth.signInWithPassword({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          });
          if (res.error) throw res.error;
          location.replace("/v2/app.html");
        } catch (ex) {
          err.textContent = ex.message || "Falha no login";
          err.classList.add("show");
          btn.disabled = false;
          btn.textContent = "Acessar";
        }
      });
    })();
  </script>
</body>
</html>
