<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>ArbiShield — Entrar / Cadastrar</title>
  <link rel="icon" type="image/png" href="/brand/favicon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/v2.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="/blocked-emails.js?v=1"></script>
  <script src="/v2.js"></script>
  <style>
    .auth-card .tabs { display: flex; gap: 8px; margin: 0 0 16px; }
    .auth-card .tabs button {
      flex: 1; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
      background: transparent; color: var(--muted, #8a9a92); font-weight: 700; cursor: pointer;
      text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
    }
    .auth-card .tabs button.active {
      background: rgba(201,242,35,0.12); border-color: rgba(201,242,35,0.45); color: var(--lime, #c9f223);
    }
    .ref-banner {
      display: none; margin: 0 0 14px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid rgba(201,242,35,0.35); background: rgba(201,242,35,0.08);
      color: #d7ff1f; font-size: 12px; font-weight: 700;
    }
    .ref-banner.show { display: block; }
    #signupExtra { display: none; }
    #signupExtra.show { display: block; }
  </style>
</head>
<body>
  <div class="auth-shell">
    <section class="auth-hero">
      <a class="brand" href="/" aria-label="ArbiShield">
        <img class="brand-logo lg" src="/brand/logo.png" srcset="/brand/logo.png 1x, /brand/logo@2x.png 2x" width="180" height="42" alt="ArbiShield" decoding="async" />
      </a>
      <div>
        <h1>Proteção <span>inteligente</span></h1>
        <p>Entre com a mesma conta do arbishield.app. Sessão compartilhada com o app e o admin.</p>
      </div>
      <p class="meta" style="margin:0">Sistema novo · isolado do SPA</p>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <div class="tabs" id="modeTabs">
          <button type="button" class="active" data-mode="login">Entrar</button>
          <button type="button" data-mode="signup">Criar conta</button>
        </div>
        <h2 id="title">Entrar</h2>
        <p class="sub" id="subtitle">Use e-mail e senha da plataforma</p>
        <div id="refBanner" class="ref-banner"></div>
        <div id="err" class="err"></div>
        <form id="form">
          <div id="signupExtra">
            <label for="fullName">Nome completo</label>
            <input id="fullName" name="fullName" type="text" autocomplete="name" />
          </div>
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" required autocomplete="username" />
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" minlength="6" />
          <button class="btn btn-primary" type="submit" id="btnSubmit">Entrar</button>
        </form>
        <!-- Marker: mfa-totp-challenge-v1 -->
        <form id="mfaForm" style="display:none;margin-top:8px">
          <p class="sub" id="mfaHint">Digite o código do autenticador (2FA)</p>
          <label for="mfaCode">Código 2FA</label>
          <input id="mfaCode" name="mfaCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="000000" />
          <button class="btn btn-primary" type="submit" id="btnMfa">Confirmar 2FA</button>
        </form>
        <div class="actions" style="margin-top:16px">
          <a class="btn btn-ghost" href="/app.html">Área do membro</a>
          <a class="btn btn-ghost" href="/admin.html">Admin</a>
        </div>
      </div>
    </section>
  </div>
  <script>
    (function () {
      // Cadastro tem página própria — não ficar na tela de login
      var qs = new URLSearchParams(location.search);
      var m = String(qs.get("mode") || "").toLowerCase();
      if (m === "signup" || qs.get("ref")) {
        location.replace("/cadastro.html" + location.search);
        return;
      }
    })();
  </script>
  <script>
    (async function () {
      var REF_KEY = "arbishield_referral_code";
      var params = new URLSearchParams(location.search);
      var mode = (params.get("mode") || "login").toLowerCase();
      var refFromUrl = String(params.get("ref") || "").trim().toUpperCase();
      if (mode === "signup" || refFromUrl) {
        location.replace("/cadastro.html" + location.search);
        return;
      }

      var refCode = refFromUrl;
      if (refCode) {
        try { localStorage.setItem(REF_KEY, refCode); } catch (e) {}
      } else {
        try { refCode = String(localStorage.getItem(REF_KEY) || "").trim().toUpperCase(); } catch (e) {}
      }

      var title = document.getElementById("title");
      var subtitle = document.getElementById("subtitle");
      var signupExtra = document.getElementById("signupExtra");
      var btnSubmit = document.getElementById("btnSubmit");
      var fullName = document.getElementById("fullName");
      var refBanner = document.getElementById("refBanner");
      var errEl = document.getElementById("err");
      if (params.get("blocked") === "1") {
        errEl.textContent = "Esta conta está bloqueada. Contate o suporte.";
        errEl.classList.add("show");
      }

      function setMode(next) {
        if (next === "signup") {
          location.replace("/cadastro.html" + location.search);
          return;
        }
        mode = "login";
        document.querySelectorAll("#modeTabs button").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-mode") === "login");
        });
        title.textContent = "Entrar";
        subtitle.textContent = "Use e-mail e senha da plataforma";
        signupExtra.classList.remove("show");
        fullName.required = false;
        btnSubmit.textContent = "Entrar";
        document.getElementById("password").autocomplete = "current-password";
        refBanner.classList.remove("show");
      }

      document.querySelectorAll("#modeTabs button").forEach(function (b) {
        b.addEventListener("click", function () {
          setMode(b.getAttribute("data-mode"));
        });
      });
      setMode("login");

      var supa = ArbiV2.client();
      var session = await supa.auth.getSession();
      if (session.data.session) {
        if (refCode) {
          try {
            var tok = session.data.session.access_token;
            await fetch("/api/arbishield/apply-referral", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + tok,
              },
              body: JSON.stringify({ code: refCode }),
            });
            try { localStorage.removeItem(REF_KEY); } catch (e) {}
          } catch (e) {}
        }
        location.replace("/app.html");
        return;
      }

      async function applyReferral(token, code) {
        if (!token || !code) return;
        var res = await fetch("/api/arbishield/apply-referral", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },
          body: JSON.stringify({ code: code }),
        });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error || "Falha ao vincular indicacao");
        return data;
      }

      document.getElementById("form").addEventListener("submit", async function (e) {
        e.preventDefault();
        var err = document.getElementById("err");
        err.classList.remove("show");
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        var name = fullName.value.trim();
        btnSubmit.disabled = true;
        try {
          if (window.ArbiIsBlockedEmail && ArbiIsBlockedEmail(email)) {
            throw new Error("Esta conta está bloqueada. Contate o suporte.");
          }
          if (ArbiV2.isBlockedEmail(email)) {
            throw new Error("Esta conta está bloqueada. Contate o suporte.");
          }
          if (mode === "signup") {
            if (!name || name.length < 3) throw new Error("Informe seu nome completo");
            var up = await supa.auth.signUp({
              email: email,
              password: password,
              options: { data: { full_name: name } },
            });
            if (up.error) throw up.error;
            var sess = up.data.session;
            if (!sess) {
              // confirmação de e-mail pode estar ativa
              var login = await supa.auth.signInWithPassword({ email: email, password: password });
              if (login.error) {
                err.textContent =
                  "Conta criada. Confirme o e-mail (se exigido) e entre para concluir a indicação.";
                err.classList.add("show");
                btnSubmit.disabled = false;
                setMode("login");
                return;
              }
              sess = login.data.session;
            }
            if (sess && sess.user && ArbiV2.isBlockedEmail(sess.user.email)) {
              await supa.auth.signOut();
              throw new Error("Esta conta está bloqueada. Contate o suporte.");
            }
            var uid = sess && sess.user && sess.user.id;
            if (uid && name) {
              try {
                await supa
                  .from("profiles")
                  .upsert({ id: uid, full_name: name }, { onConflict: "id" });
              } catch (e2) {}
            }
            var code = refCode;
            if (!code) {
              try { code = String(localStorage.getItem(REF_KEY) || "").trim().toUpperCase(); } catch (e3) {}
            }
            if (code && sess && sess.access_token) {
              await applyReferral(sess.access_token, code);
              try { localStorage.removeItem(REF_KEY); } catch (e4) {}
            }
            location.replace("/app.html");
            return;
          }

          var res = await supa.auth.signInWithPassword({ email: email, password: password });
          if (res.error) throw res.error;
          if (res.data && res.data.user && ArbiV2.isBlockedEmail(res.data.user.email)) {
            await supa.auth.signOut();
            throw new Error("Esta conta está bloqueada. Contate o suporte.");
          }
          var codeLogin = refCode;
          if (!codeLogin) {
            try { codeLogin = String(localStorage.getItem(REF_KEY) || "").trim().toUpperCase(); } catch (e5) {}
          }
          if (codeLogin && res.data.session) {
            try {
              await applyReferral(res.data.session.access_token, codeLogin);
              try { localStorage.removeItem(REF_KEY); } catch (e6) {}
            } catch (e7) {}
          }
          // Marker: mfa-totp-challenge-v1 — se a conta tem 2FA, pedir código
          var aal = await supa.auth.mfa.getAuthenticatorAssuranceLevel();
          var cur = aal.data && aal.data.currentLevel;
          var next = aal.data && aal.data.nextLevel;
          if (cur === "aal1" && next === "aal2") {
            var factors = await supa.auth.mfa.listFactors();
            var totpFactors = (factors.data && factors.data.totp) || [];
            var factor = totpFactors.find(function (f) {
              return String(f.status || "").toLowerCase() === "verified";
            }) || totpFactors[0];
            if (factor && factor.id) {
              window.__mfaFactorId = factor.id;
              document.getElementById("form").style.display = "none";
              document.getElementById("mfaForm").style.display = "block";
              document.getElementById("title").textContent = "Verificação 2FA";
              document.getElementById("subtitle").textContent =
                "Conta protegida — informe o código do autenticador";
              btnSubmit.disabled = false;
              return;
            }
          }
          // Marker: admin-mfa-required-v1 — admin sem 2FA vai cadastrar no Perfil
          try {
            if (ArbiV2.isAdminUser && (await ArbiV2.isAdminUser(supa, res.data.user))) {
              var mfaSt = ArbiV2.adminMfaStatus
                ? await ArbiV2.adminMfaStatus(supa)
                : { hasVerified: false };
              if (!mfaSt.hasVerified) {
                location.replace("/app-perfil.html?force_mfa=1");
                return;
              }
            }
          } catch (eAdm) {}
          var nextUrl = "/app.html";
          try {
            var q = new URLSearchParams(location.search || "");
            if (q.get("next")) nextUrl = q.get("next");
            else if (q.get("mfa_required") === "1") nextUrl = "/admin.html";
          } catch (eQ) {}
          location.replace(nextUrl);
        } catch (ex) {
          err.textContent = mapAuthError(ex, mode);
          err.classList.add("show");
          btnSubmit.disabled = false;
        }
      });

      document.getElementById("mfaForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        var err = document.getElementById("err");
        err.classList.remove("show");
        var btnMfa = document.getElementById("btnMfa");
        btnMfa.disabled = true;
        try {
          var code = String(document.getElementById("mfaCode").value || "").replace(/\s+/g, "");
          if (!/^\d{6}$/.test(code)) throw new Error("Código 2FA inválido (6 dígitos).");
          var factorId = window.__mfaFactorId;
          if (!factorId) throw new Error("Fator 2FA ausente — faça login de novo.");
          var ch = await supa.auth.mfa.challenge({ factorId: factorId });
          if (ch.error) throw ch.error;
          var ver = await supa.auth.mfa.verify({
            factorId: factorId,
            challengeId: ch.data.id,
            code: code,
          });
          if (ver.error) throw ver.error;
          var dest = "/app.html";
          try {
            var q2 = new URLSearchParams(location.search || "");
            if (q2.get("mfa_required") === "1") dest = "/admin.html";
            else if (q2.get("next")) dest = q2.get("next");
          } catch (eD) {}
          location.replace(dest);
        } catch (ex) {
          err.textContent = (ex && ex.message) || "Falha no 2FA";
          err.classList.add("show");
          btnMfa.disabled = false;
        }
      });

      function mapAuthError(ex, currentMode) {
        var raw = String((ex && ex.message) || ex || "");
        var code = String((ex && (ex.code || ex.error_code)) || "").toLowerCase();
        var low = raw.toLowerCase();
        if (
          low.indexOf("invalid login credentials") >= 0 ||
          code === "invalid_credentials"
        ) {
          return (
            "Credenciais inválidas. Use o mesmo e-mail/senha do site antigo " +
            "(Auth compartilhado). Se a senha estiver correta, o e-mail pode " +
            "estar sem confirmação — peça ao admin para confirmar a conta ou " +
            "redefinir a senha."
          );
        }
        if (low.indexOf("user already registered") >= 0 || code === "user_already_exists") {
          return "Este e-mail já está cadastrado. Use a aba Entrar com a senha atual.";
        }
        if (low.indexOf("email not confirmed") >= 0 || code === "email_not_confirmed") {
          return (
            "E-mail ainda não confirmado. Com o SMTP da VPS, a confirmação automática " +
            "pode falhar — peça ao admin para confirmar sua conta."
          );
        }
        if (currentMode === "signup" && (low.indexOf("rate") >= 0 || code.indexOf("rate") >= 0)) {
          return "Muitas tentativas. Aguarde um minuto e tente de novo.";
        }
        return raw || "Falha na autenticação";
      }
    })();
  </script>
</body>
</html>
