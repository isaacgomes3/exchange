<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Módulo admin — ArbiShield v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/v2/v2.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="/v2/v2.js"></script>
  <script src="/v2/v2-shell.js" defer></script>
</head>
<body data-shell="admin" data-active="">
  <div class="page-head">
    <div>
      <h1 id="title">Módulo <span>legado</span></h1>
      <p class="sub">Layout v2 · conteúdo ainda no SPA (migração gradual)</p>
    </div>
  </div>
  <div id="err" class="err"></div>
  <div class="bridge-box">
    <h2 id="boxTitle">Abrir módulo</h2>
    <p>
      Este módulo ainda usa o código do site antigo, mas a navegação lateral já é a do sistema novo.
      Ao abrir, você vai para a URL legada com a mesma sessão.
    </p>
    <div class="actions" style="margin:0">
      <a class="btn btn-primary" id="go" href="#">Abrir módulo</a>
      <a class="btn btn-ghost" href="/v2/admin.html">Voltar ao dashboard</a>
    </div>
  </div>
  <script>
    (async function () {
      var params = new URLSearchParams(location.search);
      var to = params.get("to") || "/admin";
      var t = params.get("t") || "Módulo admin";
      if (to.charAt(0) !== "/") to = "/admin";

      var activeMap = {
        "/admin/monitoring-protections": "monitoring-protections",
        "/admin/transactions": "transactions",
        "/admin/saques": "saques",
        "/admin/manual-deposits": "manual-deposits",
        "/admin/refunds": "refunds",
        "/admin/treasury": "treasury",
        "/admin/partners-distribution": "partners-distribution",
        "/admin/expenses": "expenses",
        "/admin/partners": "partners",
        "/admin/affiliates": "affiliates",
        "/admin/contestations": "contestations",
        "/admin/approvals": "approvals",
        "/admin/proofs": "proofs",
        "/admin/investigation": "investigation",
        "/admin/risk": "risk",
        "/admin/blacklist": "blacklist",
        "/admin/geo": "geo",
        "/admin/signup-attempts": "signup-attempts",
        "/admin/whatsapp": "whatsapp",
        "/admin/communication-lab": "communication-lab",
        "/admin/banners": "banners",
        "/admin/onboarding": "onboarding",
        "/admin/academia": "academia",
        "/admin/support": "support",
        "/admin/support-ai": "support-ai",
        "/admin/settings": "settings",
        "/admin/betting-houses": "betting-houses",
        "/admin/permissoes": "permissoes",
        "/admin/marketing-team": "marketing-team",
        "/admin/logs": "logs",
        "/admin/settlements-audit": "settlements-audit",
        "/admin/technical-audit": "technical-audit",
        "/admin/performance": "performance",
        "/admin/siem": "siem",
        "/admin/monitoring": "monitoring",
      };
      document.body.setAttribute("data-active", activeMap[to] || "");

      document.getElementById("title").innerHTML = t.replace(/</g, "") + ' <span>legado</span>';
      document.getElementById("boxTitle").textContent = t;
      document.getElementById("go").href = to;
      document.title = t + " — ArbiShield v2";

      var supa = ArbiV2.client();
      var user = await ArbiV2.requireUser(supa);
      if (!user) return;
      if (!(await ArbiV2.requireAdmin(supa, user))) {
        document.getElementById("err").textContent = "Sem permissão administrativa";
        document.getElementById("err").classList.add("show");
      }
    })();
  </script>
</body>
</html>
