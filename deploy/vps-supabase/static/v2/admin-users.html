<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Usuários — ArbiShield v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <meta name="arbishield-build" content="admin-users-saldo-fin-v1" />
  <link rel="stylesheet" href="/v2.css?v=users-saldo-fin-1" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="/finance-admins.js?v=fin-acl-1"></script>
  <script src="/v2.js?v=users-saldo-fin-1"></script>
  <script src="/v2-shell.js?v=users-saldo-fin-1" defer></script>
  <style>
    .ops-wallets {
      display: grid; gap: 2px; font-size: 11px; line-height: 1.35;
      font-variant-numeric: tabular-nums; min-width: 160px;
    }
    .ops-wallets .w-row { display: flex; justify-content: space-between; gap: 10px; }
    .ops-wallets .w-row span { color: var(--muted); text-transform: uppercase; font-size: 9px; font-weight: 800; letter-spacing: 0.06em; }
    .ops-wallets .w-row b { font-weight: 800; color: #fff; }
    .ops-wallets .w-row.muted b { color: var(--muted); font-weight: 700; }
    .ops-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .user-drawer-backdrop {
      display: none; position: fixed; inset: 0; z-index: 80;
      background: rgba(0,0,0,0.65); align-items: stretch; justify-content: flex-end;
    }
    .user-drawer-backdrop.open { display: flex; }
    .user-drawer {
      width: min(440px, 100%); background: #0a0a0a; border-left: 1px solid #1f1f1f;
      padding: 20px 18px 28px; overflow: auto;
    }
    .user-drawer h2 {
      margin: 0; font-size: 1.2rem; font-weight: 900; font-style: italic;
      text-transform: uppercase; letter-spacing: -0.02em;
    }
    .user-drawer h2 span { color: var(--lime); }
    .user-drawer .hint { color: var(--muted); font-size: 11px; margin: 6px 0 16px; word-break: break-all; }
    .ud-grid { display: grid; gap: 8px; margin-bottom: 16px; }
    .ud-item {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 10px 12px; border-radius: 12px; border: 1px solid #1f1f1f;
      background: rgba(255,255,255,0.02);
    }
    .ud-item .l { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .ud-item .v { font-size: 13px; font-weight: 800; text-align: right; }
    .ud-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .bal-panel {
      display: none; margin: 8px 0 16px; padding: 14px;
      border: 1px solid rgba(201,242,35,0.25); border-radius: 14px;
      background: rgba(201,242,35,0.04);
    }
    .bal-panel.show { display: block; }
    .bal-panel h3 {
      margin: 0 0 10px; font-size: 0.85rem; font-weight: 900;
      font-style: italic; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .bal-panel h3 span { color: var(--lime); }
    .bal-panel label {
      display: block; margin: 10px 0 4px;
      font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
    }
    .bal-panel select,
    .bal-panel input {
      width: 100%; box-sizing: border-box;
      height: 42px; padding: 0 12px;
      border-radius: 10px; border: 1px solid #2a2a2a;
      background: #111; color: #fff; font-weight: 700; font-size: 13px;
    }
    .bal-panel .bal-current {
      margin-top: 8px; font-size: 12px; color: var(--muted);
    }
    .bal-panel .bal-current b { color: #fff; }
    .bal-panel .bal-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .bal-panel .bal-msg {
      display: none; margin-top: 10px; font-size: 12px; font-weight: 700;
    }
    .bal-panel .bal-msg.show { display: block; }
    .bal-panel .bal-msg.ok { color: var(--lime); }
    .bal-panel .bal-msg.err { color: #ff6b6b; }
  </style>
</head>
<body data-shell="admin" data-active="users">
  <div class="page-head">
    <div>
      <h1>Gestão de <span>Usuários</span></h1>
      <p class="sub">Usuários · todas as carteiras · espelho de conta · máx. 500</p>
    </div>
  </div>
  <div id="err" class="err"></div>
  <div class="ops-stats" id="stats"></div>
  <div class="ops-toolbar">
    <div class="ops-tabs" id="tabs">
      <button type="button" class="ops-tab active" data-s="all">Todos</button>
    </div>
    <input class="ops-search" id="q" type="search" placeholder="Buscar nome ou ID…" autocomplete="off" />
    <button type="button" class="btn btn-ghost btn-sm" id="btnRefresh">Atualizar</button>
  </div>
  <div class="meta" id="meta">Carregando…</div>
  <div class="ops-panel">
    <div class="ops-table-wrap">
      <table class="ops-table">
        <thead>
          <tr><th>Perfil</th><th>Status</th><th>Carteiras</th><th>Criado</th><th>Ações</th></tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="5" class="ops-empty">Carregando…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="user-drawer-backdrop" id="userDrawer" aria-hidden="true">
    <div class="user-drawer" role="dialog" aria-modal="true">
      <h2>Conta <span>cliente</span></h2>
      <p class="hint" id="udHint">—</p>
      <div class="ud-grid" id="udProfile"></div>
      <h2 style="font-size:1rem;margin:8px 0 10px">Carteiras</h2>
      <div class="ud-grid" id="udWallets"></div>

      <div class="bal-panel" id="balPanel">
        <h3>Ajuste de <span>saldo</span></h3>
        <label for="balWallet">Carteira</label>
        <select id="balWallet">
          <option value="real">Saldo Real (apostador)</option>
          <option value="desafio">Saldo Desafio</option>
          <option value="investor">Saldo Provedor</option>
          <option value="refund">Saldo Reembolso</option>
          <option value="demo">Saldo Demo</option>
        </select>
        <label for="balMode">Operação</label>
        <select id="balMode">
          <option value="credit">Inserir (crédito)</option>
          <option value="set">Alterar (definir total)</option>
          <option value="debit">Remover (débito)</option>
        </select>
        <p class="bal-current" id="balCurrent">Saldo atual: <b>—</b></p>
        <label for="balAmount" id="balAmountLabel">Valor (R$)</label>
        <input id="balAmount" type="number" step="0.01" min="0" placeholder="0,00" />
        <label for="balReason">Motivo (auditoria)</label>
        <input id="balReason" type="text" maxlength="200" placeholder="Ex: depósito PIX manual, ajuste pós-auditoria" />
        <div class="bal-actions">
          <button type="button" class="btn btn-primary" id="balSubmit">Confirmar ajuste</button>
        </div>
        <div class="bal-msg" id="balMsg"></div>
      </div>

      <div class="ud-actions">
        <button type="button" class="btn btn-primary" id="udMirror">Acessar Conta (Espelho)</button>
        <button type="button" class="btn btn-ghost" id="udClose">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    (async function () {
      var money = ArbiV2.money;
      var n = function (v) { return Number(v || 0); };
      var esc = function (s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      };
      var supa = ArbiV2.client();
      var user = await ArbiV2.requireUser(supa);
      if (!user) return;
      if (!(await ArbiV2.requireAdmin(supa, user))) {
        document.getElementById("err").textContent = "Sem permissão";
        document.getElementById("err").classList.add("show");
        return;
      }

      var canFinance =
        typeof ArbiV2.canAccessFinance === "function" &&
        !!ArbiV2.canAccessFinance(user.email);

      var rows = [];
      var statusFilter = "all";
      var qDebounced = "";
      var timer = null;
      var selected = null;
      var balBusy = false;

      var PROFILE_SELECT =
        "id,full_name,account_status,phone,cpf,pix_key,location,is_affiliate," +
        "balance_cents,reusable_balance_cents,deduction_balance_cents,demo_balance_cents,locked_balance_cents," +
        "investor_balance_cents,demo_balance_provider_cents,desafio_balance_cents," +
        "pending_balance_cents,total_profit_cents,created_at,updated_at";

      var WALLET_FIELD = {
        real: "balance_cents",
        desafio: "desafio_balance_cents",
        investor: "investor_balance_cents",
        refund: "deduction_balance_cents",
        demo: "demo_balance_cents",
      };

      function norm(s) {
        return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
      }

      function statusClass(v) {
        var s = String(v || "").toLowerCase();
        if (/active|aprov|ok/.test(s)) return "ok";
        if (/pend|review/.test(s)) return "warn";
        if (/block|ban|inativ|suspend/.test(s)) return "bad";
        return "";
      }

      function walletLines(r, opts) {
        opts = opts || {};
        var compact = !!opts.compact;
        var items = [
          {
            l: "Apostador",
            v:
              n(r.balance_cents) +
              n(r.reusable_balance_cents) +
              n(r.deduction_balance_cents),
          },
          { l: "Real", v: n(r.balance_cents), muted: true },
          { l: "Reembolso", v: n(r.deduction_balance_cents), muted: true },
          { l: "Reutilizável", v: n(r.reusable_balance_cents), muted: true },
          { l: "Desafio", v: n(r.desafio_balance_cents) },
          { l: "Provedor", v: n(r.investor_balance_cents) + n(r.demo_balance_provider_cents) },
          { l: "Congelado", v: n(r.locked_balance_cents) },
          { l: "Demo", v: n(r.demo_balance_cents) },
          { l: "Pendente", v: n(r.pending_balance_cents) },
          { l: "Lucro", v: n(r.total_profit_cents) },
        ];
        if (compact) {
          items = items.filter(function (it) {
            return (
              it.l === "Apostador" ||
              it.l === "Desafio" ||
              it.l === "Provedor" ||
              it.l === "Congelado" ||
              it.v > 0
            );
          });
        }
        return (
          '<div class="ops-wallets">' +
          items
            .map(function (it) {
              return (
                '<div class="w-row' +
                (it.muted ? " muted" : "") +
                '"><span>' +
                it.l +
                "</span><b>" +
                money(it.v) +
                "</b></div>"
              );
            })
            .join("") +
          "</div>"
        );
      }

      function renderStats(total, filtered) {
        document.getElementById("stats").innerHTML =
          '<div class="ops-stat"><div class="l">Total</div><div class="v">' + total + "</div></div>" +
          '<div class="ops-stat"><div class="l">Visíveis</div><div class="v lime">' + filtered + "</div></div>" +
          '<div class="ops-stat"><div class="l">Tabela</div><div class="v">profiles</div></div>';
      }

      function currentWalletCents(r) {
        if (!r) return 0;
        var field = WALLET_FIELD[document.getElementById("balWallet").value] || "balance_cents";
        return n(r[field]);
      }

      function refreshBalCurrent() {
        var el = document.getElementById("balCurrent");
        if (!selected) {
          el.innerHTML = "Saldo atual: <b>—</b>";
          return;
        }
        el.innerHTML =
          "Saldo atual: <b>" + money(currentWalletCents(selected)) + "</b>";
        var mode = document.getElementById("balMode").value;
        document.getElementById("balAmountLabel").textContent =
          mode === "set" ? "Novo saldo total (R$)" : "Valor (R$)";
        if (mode === "set") {
          document.getElementById("balAmount").value = (
            currentWalletCents(selected) / 100
          ).toFixed(2);
        }
      }

      function showBalMsg(text, ok) {
        var el = document.getElementById("balMsg");
        el.textContent = text || "";
        el.className = "bal-msg show " + (ok ? "ok" : "err");
      }

      function clearBalMsg() {
        var el = document.getElementById("balMsg");
        el.textContent = "";
        el.className = "bal-msg";
      }

      function resetBalForm(r) {
        document.getElementById("balWallet").value = "real";
        document.getElementById("balMode").value = "credit";
        document.getElementById("balAmount").value = "";
        document.getElementById("balReason").value = "";
        clearBalMsg();
        refreshBalCurrent();
      }

      function fillDrawerProfile(r) {
        document.getElementById("udHint").textContent =
          (r.full_name || "—") + " · " + r.id;
        document.getElementById("udProfile").innerHTML = [
          ["Status", r.account_status || "—"],
          ["Telefone", r.phone || "—"],
          ["CPF", r.cpf || "—"],
          ["PIX", r.pix_key || "—"],
          ["Local", r.location || "—"],
          ["Afiliado", r.is_affiliate ? "Sim" : "Não"],
          ["Criado", r.created_at ? new Date(r.created_at).toLocaleString("pt-BR") : "—"],
          ["Atualizado", r.updated_at ? new Date(r.updated_at).toLocaleString("pt-BR") : "—"],
        ]
          .map(function (pair) {
            return (
              '<div class="ud-item"><div class="l">' +
              esc(pair[0]) +
              '</div><div class="v">' +
              esc(pair[1]) +
              "</div></div>"
            );
          })
          .join("");
        document.getElementById("udWallets").innerHTML = [
          [
            "Apostador (real+reembolso+reutilizável)",
            n(r.balance_cents) +
              n(r.reusable_balance_cents) +
              n(r.deduction_balance_cents),
          ],
          ["Real", n(r.balance_cents)],
          ["Saldo Reembolso", n(r.deduction_balance_cents)],
          ["Reutilizável (legado)", n(r.reusable_balance_cents)],
          ["Desafio", n(r.desafio_balance_cents)],
          ["Provedor", n(r.investor_balance_cents)],
          ["Provedor demo", n(r.demo_balance_provider_cents)],
          ["Congelado / proteções", n(r.locked_balance_cents)],
          ["Demo apostador", n(r.demo_balance_cents)],
          ["Pendente", n(r.pending_balance_cents)],
          ["Lucro total", n(r.total_profit_cents)],
        ]
          .map(function (pair) {
            return (
              '<div class="ud-item"><div class="l">' +
              esc(pair[0]) +
              '</div><div class="v">' +
              money(pair[1]) +
              "</div></div>"
            );
          })
          .join("");
      }

      function openDrawer(r, opts) {
        opts = opts || {};
        selected = r;
        fillDrawerProfile(r);

        var panel = document.getElementById("balPanel");
        if (canFinance) {
          panel.classList.add("show");
          if (!opts.keepBalForm) resetBalForm(r);
          else refreshBalCurrent();
        } else {
          panel.classList.remove("show");
        }

        var backdrop = document.getElementById("userDrawer");
        backdrop.classList.add("open");
        backdrop.setAttribute("aria-hidden", "false");
      }

      function closeDrawer() {
        selected = null;
        var backdrop = document.getElementById("userDrawer");
        backdrop.classList.remove("open");
        backdrop.setAttribute("aria-hidden", "true");
      }

      function startMirror(r) {
        if (!r || !r.id) return;
        if (!window.ArbiV2 || !ArbiV2.setImpersonation) {
          alert("Espelho indisponível neste build.");
          return;
        }
        ArbiV2.setImpersonation(r.id, {
          name: r.full_name || "",
          redirect: "/app-carteira.html",
        });
      }

      async function accessToken() {
        var sess = await supa.auth.getSession();
        return (
          (sess &&
            sess.data &&
            sess.data.session &&
            sess.data.session.access_token) ||
          null
        );
      }

      async function submitBalanceAdjust() {
        if (!canFinance) {
          showBalMsg("Sem permissão financeira", false);
          return;
        }
        if (!selected || !selected.id) {
          showBalMsg("Selecione um usuário", false);
          return;
        }
        if (balBusy) return;

        var wallet = document.getElementById("balWallet").value;
        var mode = document.getElementById("balMode").value;
        var reason = String(document.getElementById("balReason").value || "").trim();
        var amountRaw = String(document.getElementById("balAmount").value || "").trim();
        if (!amountRaw) {
          showBalMsg("Informe o valor", false);
          return;
        }
        var amountReais = Number(amountRaw.replace(",", "."));
        if (!Number.isFinite(amountReais)) {
          showBalMsg("Valor inválido", false);
          return;
        }
        var amountCents = Math.round(amountReais * 100);
        if (mode === "set" && amountCents < 0) {
          showBalMsg("Saldo total não pode ser negativo", false);
          return;
        }
        if ((mode === "credit" || mode === "debit") && !(amountCents > 0)) {
          showBalMsg("Informe um valor maior que zero", false);
          return;
        }
        if (!reason) {
          showBalMsg("Motivo obrigatório para auditoria", false);
          return;
        }

        var before = currentWalletCents(selected);
        var previewAfter =
          mode === "set"
            ? amountCents
            : mode === "credit"
              ? before + amountCents
              : before - amountCents;
        if (previewAfter < 0) {
          showBalMsg("Saldo insuficiente para débito", false);
          return;
        }

        var opLabel =
          mode === "credit"
            ? "inserir " + money(amountCents)
            : mode === "debit"
              ? "remover " + money(amountCents)
              : "definir total em " + money(amountCents);
        if (
          !window.confirm(
            "Confirmar " +
              opLabel +
              " na carteira " +
              wallet +
              " de " +
              (selected.full_name || selected.id) +
              "?\nAtual: " +
              money(before) +
              " → Novo: " +
              money(previewAfter)
          )
        ) {
          return;
        }

        balBusy = true;
        clearBalMsg();
        document.getElementById("balSubmit").disabled = true;
        try {
          var t = await accessToken();
          if (!t) throw new Error("Sessão expirada");
          var res = await fetch("/api/arbishield/adjust-balance", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + t,
            },
            body: JSON.stringify({
              userId: selected.id,
              wallet: wallet,
              mode: mode,
              amountCents: amountCents,
              reason: reason,
            }),
          });
          var text = await res.text();
          var data = {};
          try {
            data = text ? JSON.parse(text) : {};
          } catch (e) {
            var looksHtml = /<\s*html|405\s+Not\s+Allowed|nginx/i.test(text || "");
            if (res.status === 405 || looksHtml) {
              data = {
                error:
                  "API de ajuste indisponível (HTTP " +
                  res.status +
                  "). Proxy Nginx/shim fora do ar — rode o hotfix saldo-adm na VPS.",
              };
            } else {
              data = {
                error:
                  "Resposta inválida do servidor (HTTP " +
                  res.status +
                  ")",
              };
            }
          }
          if (!res.ok || data.ok === false) {
            throw new Error(data.error || data.message || "Falha HTTP " + res.status);
          }

          var field = WALLET_FIELD[wallet];
          selected[field] = data.afterCents;
          var idx = rows.findIndex(function (x) {
            return x.id === selected.id;
          });
          if (idx >= 0) rows[idx][field] = data.afterCents;

          showBalMsg(
            "OK: " +
              money(data.beforeCents) +
              " → " +
              money(data.afterCents) +
              (data.unchanged ? " (sem alteração)" : ""),
            true
          );
          document.getElementById("balAmount").value = "";
          fillDrawerProfile(selected);
          refreshBalCurrent();
          render();
        } catch (ex) {
          showBalMsg(ex.message || "Erro ao ajustar saldo", false);
        } finally {
          balBusy = false;
          document.getElementById("balSubmit").disabled = false;
        }
      }

      function render() {
        var parts = norm(qDebounced).split(/\s+/).filter(Boolean);
        var filtered = rows.filter(function (r) {
          if (statusFilter !== "all" && String(r.account_status || "") !== statusFilter) return false;
          if (!parts.length) return true;
          var hay = norm(
            [r.full_name, r.id, r.account_status, r.phone, r.cpf, r.pix_key, r.location]
              .filter(Boolean)
              .join(" ")
          );
          return parts.every(function (p) {
            return hay.indexOf(p) >= 0;
          });
        });
        renderStats(rows.length, filtered.length);
        document.getElementById("meta").textContent =
          filtered.length +
          " usuário(s) · carteiras completas" +
          (canFinance ? " · ajuste de saldo liberado" : "");
        var html = filtered
          .slice(0, 100)
          .map(function (r) {
            var sc = statusClass(r.account_status);
            return (
              "<tr data-uid=\"" +
              esc(r.id) +
              "\"><td><strong>" +
              esc(r.full_name || "—") +
              '</strong><div class="meta">' +
              String(r.id).slice(0, 8) +
              "…</div></td><td><span class=\"ops-badge " +
              sc +
              '">' +
              esc(r.account_status || "—") +
              "</span></td><td>" +
              walletLines(r, { compact: true }) +
              "</td><td>" +
              (r.created_at ? new Date(r.created_at).toLocaleString("pt-BR") : "—") +
              '</td><td><div class="ops-actions">' +
              '<button type="button" class="btn btn-ghost btn-sm" data-view="1">Ver dados</button>' +
              (canFinance
                ? '<button type="button" class="btn btn-primary btn-sm" data-saldo="1">Saldo</button>'
                : "") +
              '<button type="button" class="btn btn-primary btn-sm" data-mirror="1">Espelho</button>' +
              "</div></td></tr>"
            );
          })
          .join("");
        document.getElementById("tbody").innerHTML =
          html || '<tr><td colspan="5" class="ops-empty">Nenhum usuário</td></tr>';

        document.querySelectorAll("#tbody tr[data-uid]").forEach(function (tr) {
          var id = tr.getAttribute("data-uid");
          var r = rows.find(function (x) {
            return x.id === id;
          });
          if (!r) return;
          var viewBtn = tr.querySelector("[data-view]");
          var mirBtn = tr.querySelector("[data-mirror]");
          var saldoBtn = tr.querySelector("[data-saldo]");
          if (viewBtn) {
            viewBtn.addEventListener("click", function (ev) {
              ev.stopPropagation();
              openDrawer(r);
            });
          }
          if (saldoBtn) {
            saldoBtn.addEventListener("click", function (ev) {
              ev.stopPropagation();
              openDrawer(r);
              var panel = document.getElementById("balPanel");
              if (panel) panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
            });
          }
          if (mirBtn) {
            mirBtn.addEventListener("click", function (ev) {
              ev.stopPropagation();
              startMirror(r);
            });
          }
          tr.addEventListener("click", function () {
            openDrawer(r);
          });
        });
      }

      function buildTabs() {
        var set = {};
        rows.forEach(function (r) {
          if (r.account_status) set[String(r.account_status)] = 1;
        });
        var statuses = Object.keys(set).slice(0, 8);
        var tabs = document.getElementById("tabs");
        tabs.innerHTML =
          '<button type="button" class="ops-tab active" data-s="all">Todos</button>' +
          statuses
            .map(function (s) {
              return '<button type="button" class="ops-tab" data-s="' + esc(s) + '">' + esc(s) + "</button>";
            })
            .join("");
        tabs.querySelectorAll(".ops-tab").forEach(function (btn) {
          btn.addEventListener("click", function () {
            tabs.querySelectorAll(".ops-tab").forEach(function (b) {
              b.classList.remove("active");
            });
            btn.classList.add("active");
            statusFilter = btn.getAttribute("data-s") || "all";
            render();
          });
        });
      }

      document.getElementById("q").addEventListener("input", function (e) {
        clearTimeout(timer);
        var v = e.target.value;
        timer = setTimeout(function () {
          qDebounced = v;
          render();
        }, 350);
      });

      document.getElementById("udClose").onclick = closeDrawer;
      document.getElementById("userDrawer").addEventListener("click", function (e) {
        if (e.target === document.getElementById("userDrawer")) closeDrawer();
      });
      document.getElementById("udMirror").onclick = function () {
        if (selected) startMirror(selected);
      };
      document.getElementById("balWallet").onchange = refreshBalCurrent;
      document.getElementById("balMode").onchange = refreshBalCurrent;
      document.getElementById("balSubmit").onclick = function () {
        submitBalanceAdjust().catch(function (ex) {
          showBalMsg(ex.message || "Erro", false);
        });
      };

      async function load() {
        document.getElementById("err").classList.remove("show");
        var res = await supa
          .from("profiles")
          .select(PROFILE_SELECT)
          .order("created_at", { ascending: false })
          .limit(500);
        if (res.error) throw res.error;
        rows = res.data || [];
        buildTabs();
        render();
      }

      document.getElementById("btnRefresh").onclick = function () {
        load().catch(function (ex) {
          document.getElementById("err").textContent = ex.message || "Erro";
          document.getElementById("err").classList.add("show");
        });
      };

      try {
        await load();
      } catch (ex) {
        document.getElementById("err").textContent = ex.message || "Erro";
        document.getElementById("err").classList.add("show");
        document.getElementById("tbody").innerHTML = "";
      }
    })();
  </script>
</body>
</html>
