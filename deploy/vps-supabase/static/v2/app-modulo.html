<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Módulo app — ArbiShield v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/v2/v2.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="/v2/v2.js"></script>
  <script src="/v2/v2-shell.js" defer></script>
</head>
<body data-shell="app" data-active="">
  <div class="page-head">
    <div>
      <h1 id="title">Módulo <span>legado</span></h1>
      <p class="sub">Layout v2 · conteúdo ainda no SPA do membro</p>
    </div>
  </div>
  <div class="bridge-box">
    <h2 id="boxTitle">Abrir módulo</h2>
    <p>
      Esta tela ainda roda no app antigo. A sidebar já é a do sistema novo —
      abra o módulo com a mesma sessão.
    </p>
    <div class="actions" style="margin:0">
      <a class="btn btn-primary" id="go" href="#">Abrir no app</a>
      <a class="btn btn-ghost" href="/v2/app.html">Visão geral</a>
    </div>
  </div>
  <script>
    (async function () {
      var params = new URLSearchParams(location.search);
      var to = params.get("to") || "/app";
      var t = params.get("t") || "App";
      if (to.charAt(0) !== "/") to = "/app";

      var activeMap = {
        "/app/proteger": "proteger",
        "/app/protecoes": "protecoes",
        "/app/desafio": "desafio",
        "/app/carteira": "carteira",
        "/app/suporte": "suporte",
        "/app/afiliados": "afiliados",
        "/app/partners": "partners",
        "/app/baixar-app": "baixar-app",
        "/app/perfil": "perfil",
        "/app/configuracoes": "config",
      };
      document.body.setAttribute("data-active", activeMap[to] || "home");
      document.getElementById("title").innerHTML = t.replace(/</g, "") + ' <span>legado</span>';
      document.getElementById("boxTitle").textContent = t;
      document.getElementById("go").href = to;
      document.title = t + " — ArbiShield v2";

      await ArbiV2.requireUser(ArbiV2.client());
    })();
  </script>
</body>
</html>
