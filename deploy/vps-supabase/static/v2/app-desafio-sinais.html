<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Painel de Sinais · Desafio ArbiShield</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/v2.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="/v2.js"></script>
  <script src="/desafio-ciclo-math.js"></script>
  <script src="/v2-shell.js" defer></script>
  <style>
    .sinais-wrap { width: 100%; max-width: none; margin: 0; box-sizing: border-box; }
    body[data-shell="app"] .v2-page:has(.sinais-wrap) {
      padding-left: 10px;
      padding-right: 10px;
    }
    .sinais-panel {
      border: 1px solid rgba(255,255,255,0.1);
      background: linear-gradient(165deg, rgba(12,40,34,0.95), rgba(6,18,16,0.98));
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    }
    .sinais-head {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.25);
    }
    .sinais-head h2 {
      margin: 0;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--lime, #c6ff00);
      font-weight: 800;
    }
    .sinais-block { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .sinais-block:last-child { border-bottom: 0; }
    .sinais-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; font-weight: 700; }
    .sinais-status { font-size: 14px; font-weight: 800; color: #fbbf24; line-height: 1.4; }
    .sinais-status.is-ready { color: var(--lime, #c6ff00); }
    .sinais-status.is-success { color: #4ade80; }
    .sinais-balance { font-size: 22px; font-weight: 900; color: #fff; margin-top: 4px; }
    .sinais-match { font-size: 16px; font-weight: 800; color: #fff; }
    .sinais-leg {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 10px;
    }
    .sinais-leg h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #cbd5e1; }
    .sinais-leg.zebra h3 { color: var(--lime, #c6ff00); }
    .sinais-leg.fav h3 { color: #93c5fd; }
    .sinais-leg p { margin: 0; font-size: 14px; color: #e2e8f0; line-height: 1.45; }
    .sinais-leg .exact {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 900;
      color: #fff;
    }
    .sinais-leg .exact em { font-style: normal; color: #93c5fd; }
    .sinais-leg .auto {
      display: inline-block;
      margin-top: 8px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0b1a16;
      background: var(--lime, #c6ff00);
      padding: 3px 8px;
      border-radius: 4px;
    }
    .sinais-proj {
      font-size: 15px;
      font-weight: 800;
      color: var(--lime, #c6ff00);
    }
    .sinais-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .sinais-actions .btn { flex: 1; min-width: 160px; justify-content: center; }
    .sinais-stake-field { margin-top: 10px; }
    .sinais-stake-field label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .sinais-stake-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }
    .sinais-hint { margin-top: 8px; font-size: 12px; color: #94a3b8; line-height: 1.4; }
    .sinais-err { color: #f87171; font-size: 13px; margin-top: 10px; }
    .sinais-back { display: inline-block; margin-bottom: 14px; color: #94a3b8; text-decoration: none; font-size: 13px; font-weight: 600; }
    .sinais-back:hover { color: var(--lime, #c6ff00); }
  </style>
</head>
<body data-shell="app" data-active="desafio">
  <div class="page-head">
    <div>
      <h1>Painel de <span>Sinais</span></h1>
      <p class="sub">Ciclo de extração · até 5 entradas · lucro alvo 5%</p>
    </div>
  </div>

  <div class="sinais-wrap">
    <a class="sinais-back" href="/app-desafio.html">← Voltar à jornada</a>
    <div id="err" class="err"></div>
    <div class="sinais-panel" id="panel">
      <div class="sinais-head"><h2>Painel de Sinais &amp; Arbitragem</h2></div>
      <div class="sinais-block"><div class="loading">Carregando sinal…</div></div>
    </div>
  </div>

  <script>
    (async function () {
      var money = ArbiV2.money;
      var MathCiclo = window.ArbiDesafioCiclo;
      var supa = ArbiV2.client();
      var user = await ArbiV2.requireUser(supa);
      if (!user) return;

      var params = new URLSearchParams(location.search);
      var stepId = params.get("stepId") || params.get("step") || "";
      var state = null;

      function $(id) { return document.getElementById(id); }
      function showErr(msg) {
        var el = $("err");
        el.textContent = msg || "";
        el.classList.toggle("show", !!msg);
      }
      function esc(v) {
        return String(v == null ? "" : v)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }
      function reaisToCents(v) {
        var s = String(v || "").trim().replace(/\s/g, "");
        if (!s) return 0;
        if (s.indexOf(",") >= 0) {
          s = s.replace(/\./g, "").replace(",", ".");
        }
        var n = Number(s);
        return Number.isFinite(n) ? Math.round(n * 100) : 0;
      }
      function centsToInput(c) {
        return (Number(c || 0) / 100).toFixed(2).replace(".", ",");
      }

      async function api(path, body) {
        var session = await supa.auth.getSession();
        var token = session.data.session && session.data.session.access_token;
        var res = await fetch(path, {
          method: "POST",
          headers: {
            Authorization: "Bearer " + token,
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body || {}),
        });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error || "Falha na API");
        return data;
      }

      function statusText(st, entry, max) {
        if (st === "success_closed") return { cls: "is-success", text: "✅ CICLO ENCERRADO — sucesso na casa externa (+5%)" };
        if (st === "pending_entry") return { cls: "", text: "⏳ ENTRADA ENVIADA — aguardando resultado (Entrada " + entry + " de " + max + ")" };
        if (st === "extraction_active") return { cls: "", text: "⚠️ CICLO DE EXTRAÇÃO ATIVO (Entrada " + entry + " de " + max + ")" };
        return { cls: "is-ready", text: "🟢 PRONTO PARA ENTRADA 1 DE " + max };
      }

      function recomputeLocal(zebraCents) {
        if (!state || !state.sinal) return null;
        var s = state.sinal;
        return MathCiclo.buildSinalPreview({
          zebraStakeCents: zebraCents,
          arbiOdd: s.arbiOdd,
          casaOdd: s.casaOdd,
          targetProfitPct: s.targetProfitPct || 5,
        });
      }

      async function fetchDesafios() {
        var res = await fetch("/api/arbishield/desafios", {
          cache: "no-store",
          headers: { accept: "application/json" },
        });
        var data = await res.json().catch(function () { return []; });
        if (res.ok && Array.isArray(data)) return data;
        var sb = await supa
          .from("desafios")
          .select("*,desafio_steps(*)")
          .is("deleted_at", null)
          .order("updated_at", { ascending: false })
          .limit(20);
        if (sb.error) throw new Error(sb.error.message || "Não foi possível carregar desafios");
        return sb.data || [];
      }

      function pickDesafioAndStep(rows, wantStepId) {
        var alive = (rows || []).filter(function (d) { return !d.deleted_at; });
        function stepsOf(d) {
          return (d.desafio_steps || [])
            .slice()
            .sort(function (a, b) {
              return (Number(a.step_index) || 0) - (Number(b.step_index) || 0);
            });
        }
        var withSteps = alive.filter(function (d) {
          return stepsOf(d).length > 0;
        });
        // Prefer ativo com etapas; senão qualquer com etapas (inclui rascunho lançado)
        var ordered = withSteps
          .slice()
          .sort(function (a, b) {
            return Number(!!b.is_active) - Number(!!a.is_active);
          });

        if (wantStepId) {
          for (var i = 0; i < ordered.length; i++) {
            var st = stepsOf(ordered[i]).find(function (s) {
              return String(s.id) === String(wantStepId);
            });
            if (st) return { desafio: ordered[i], step: st };
          }
        }
        for (var j = 0; j < ordered.length; j++) {
          var list = stepsOf(ordered[j]);
          for (var k = 0; k < list.length; k++) {
            if (String(list[k].status) !== "done") {
              return { desafio: ordered[j], step: list[k] };
            }
          }
          if (list.length) return { desafio: ordered[j], step: list[0] };
        }
        return null;
      }

      async function buildManualSinalState(desafio, step) {
        var MathC = MathCiclo || window.ArbiDesafioCiclo;
        var targetPct = Number(desafio.target_profit_pct) || 5;
        var maxEntries = Math.min(
          5,
          Math.max(
            Number(desafio.total_steps) || 1,
            (desafio.desafio_steps || []).length || 1
          )
        );
        var arbiOdd = Number(step.arbi_odd != null ? step.arbi_odd : step.home_odd);
        var casaOdd = Number(step.casa_odd != null ? step.casa_odd : step.away_odd);
        if (!(arbiOdd > 1) && casaOdd > 1 && MathC) {
          try {
            arbiOdd = MathC.calcZebraOddFromFavorite(
              casaOdd,
              targetPct,
              Number(step.casa_commission_pct) || 0,
              Number(step.arbi_commission_pct) || 0
            );
          } catch (e) { /* */ }
        }

        var parts = [];
        var bal = 0;
        try {
          var prof = await supa
            .from("profiles")
            .select("desafio_balance_cents")
            .eq("id", user.id)
            .maybeSingle();
          bal = Number(prof.data && prof.data.desafio_balance_cents) || 0;
        } catch (e) { /* */ }
        try {
          var pr = await supa
            .from("desafio_participations")
            .select("*")
            .eq("user_id", user.id)
            .eq("desafio_id", desafio.id)
            .eq("side", "arbishield")
            .order("created_at", { ascending: true })
            .limit(50);
          if (!pr.error && Array.isArray(pr.data)) parts = pr.data;
        } catch (e) { /* */ }

        var pending = parts.find(function (p) {
          return String(p.result || "").toLowerCase() === "pending";
        });
        var won = parts.filter(function (p) {
          return String(p.result || "").toLowerCase() === "won";
        });
        var lost = parts.filter(function (p) {
          return String(p.result || "").toLowerCase() === "lost";
        });
        var retained = 0;
        if (won.length) {
          var last = won[won.length - 1];
          retained = (Number(last.amount_cents) || 0) + (Number(last.profit_cents) || 0);
        }
        var entryNumber = pending ? parts.length : parts.length + 1;
        if (entryNumber < 1) entryNumber = 1;
        if (entryNumber > maxEntries) entryNumber = maxEntries;

        var status = "ready";
        if (lost.length && !pending && lost.length >= won.length && parts.length && String(parts[parts.length - 1].result).toLowerCase() === "lost") {
          status = "success_closed";
        } else if (pending) {
          status = "pending_entry";
        } else if (won.length > 0) {
          status = "extraction_active";
        }

        var zebraStake =
          entryNumber === 1
            ? Number(desafio.initial_balance_cents) || 20000
            : retained || bal || Number(desafio.initial_balance_cents) || 0;

        var prev = MathC
          ? MathC.buildSinalPreview({
              zebraStakeCents: zebraStake,
              arbiOdd: arbiOdd,
              casaOdd: casaOdd,
              arbiCommissionPct: Number(step.arbi_commission_pct) || 0,
              casaCommissionPct: Number(step.casa_commission_pct) || 0,
              targetProfitPct: targetPct,
            })
          : {
              zebraStakeCents: zebraStake,
              casaStakeCents: 0,
              projectedReturnCents: zebraStake,
            };

        return {
          ok: true,
          status: status,
          entryNumber: entryNumber,
          maxEntries: maxEntries,
          retainedCents: retained,
          desafioBalanceCents: bal,
          sinal: {
            stepId: step.id,
            desafioId: desafio.id,
            title: desafio.title,
            matchLabel:
              step.match_label ||
              [step.home_team, step.away_team].filter(Boolean).join(" x ") ||
              ". " + (step.market_name || "Etapa"),
            zebraTeam: step.arbi_team_name || step.away_team || "Zebra",
            favoriteTeam: step.casa_team_name || step.home_team || "Favorito",
            arbiOdd: arbiOdd,
            casaOdd: casaOdd,
            zebraStakeCents: prev.zebraStakeCents,
            casaStakeCents: prev.casaStakeCents,
            projectedReturnCents: prev.projectedReturnCents,
            targetProfitPct: targetPct,
            externalBetLink: step.external_bet_link || null,
            allocatedAutomatically: entryNumber > 1,
          },
        };
      }

      async function registerEntry(amountCents) {
        var session = await supa.auth.getSession();
        var token = session.data.session && session.data.session.access_token;
        var res = await fetch("/api/arbishield/desafio-register", {
          method: "POST",
          headers: {
            Authorization: "Bearer " + token,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            stepId: state.sinal.stepId,
            side: "arbishield",
            amountCents: amountCents,
          }),
        });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error || "Falha ao registrar entrada");
        return data;
      }

      function paint() {
        if (!state || !state.sinal) {
          $("panel").innerHTML =
            '<div class="sinais-head"><h2>Painel de Sinais &amp; Arbitragem</h2></div>' +
            '<div class="sinais-block"><p class="sinais-hint">Nenhum evento de desafio disponível. Lance um desafio no admin (etapas manuais).</p></div>';
          return;
        }
        var s = state.sinal;
        var entry = state.entryNumber || 1;
        var max = state.maxEntries || 5;
        var st = statusText(state.status, entry, max);
        var retained = state.retainedCents || 0;
        var zebra = s.zebraStakeCents || 0;
        var casa = s.casaStakeCents || 0;
        var projected = s.projectedReturnCents || 0;
        var auto = entry > 1 || s.allocatedAutomatically;
        var canConfirm = state.status === "ready" || state.status === "extraction_active";
        var stakeEditable = entry === 1 && canConfirm;

        var stakeHtml = stakeEditable
          ? '<div class="sinais-stake-field">' +
            "<label>Quanto quer apostar na Zebra (R$)</label>" +
            '<input id="zebraStakeInput" type="text" inputmode="decimal" value="' +
            esc(centsToInput(zebra)) +
            '" />' +
            '<p class="sinais-hint">Evento do Desafio (manual). O sistema calcula a aposta na casa externa.</p></div>'
          : '<div class="exact">' +
            esc(money(zebra)) +
            (auto ? ' <span class="auto">Alocado automaticamente</span>' : "") +
            "</div>";

        $("panel").innerHTML =
          '<div class="sinais-head"><h2>Painel de Sinais &amp; Arbitragem</h2></div>' +
          '<div class="sinais-block">' +
          '<div class="sinais-label">Status do ciclo</div>' +
          '<div class="sinais-status ' + st.cls + '">' + esc(st.text) + "</div>" +
          '<div class="sinais-label" style="margin-top:14px">Saldo atual retido na plataforma</div>' +
          '<div class="sinais-balance" id="retainedBal">' +
          esc(money(retained > 0 ? retained : state.desafioBalanceCents || 0)) +
          "</div></div>" +
          '<div class="sinais-block">' +
          '<div class="sinais-label">Oportunidade atual (evento do Desafio)</div>' +
          '<div class="sinais-match">' +
          esc(s.matchLabel || (s.favoriteTeam + " vs " + s.zebraTeam)) +
          "</div></div>" +
          '<div class="sinais-block">' +
          '<div class="sinais-leg zebra">' +
          "<h3>1. Sua aposta (aqui no site)</h3>" +
          "<p>Seleção: <strong>" +
          esc(s.zebraTeam || "Zebra") +
          "</strong> | Odd: <strong>" +
          esc(s.arbiOdd) +
          "</strong></p>" +
          stakeHtml +
          "</div>" +
          '<div class="sinais-leg fav">' +
          "<h3>2. Aposta na casa externa</h3>" +
          "<p>Seleção: <strong>" +
          esc(s.favoriteTeam || "Favorito") +
          "</strong> | Odd: <strong>" +
          esc(s.casaOdd) +
          "</strong></p>" +
          '<div class="exact">👉 Aposte exatamente: <em id="casaExact">' +
          esc(money(casa)) +
          "</em></div>" +
          (s.externalBetLink
            ? '<p class="sinais-hint" style="margin-top:10px"><a href="' +
              esc(s.externalBetLink) +
              '" target="_blank" rel="noopener">Abrir link da casa externa</a></p>'
            : "") +
          "</div></div>" +
          '<div class="sinais-block">' +
          '<div class="sinais-label">Retorno projetado (lucro de ' +
          esc(s.targetProfitPct || 5) +
          "% garantido)</div>" +
          '<div class="sinais-proj" id="projReturn">' +
          esc(money(projected)) +
          "</div>" +
          '<div class="sinais-actions" style="margin-top:16px">' +
          (canConfirm
            ? '<button type="button" class="btn btn-primary" id="btnConfirm">Confirmar e enviar sinal</button>'
            : '<button type="button" class="btn btn-ghost" disabled>Aguardando resultado</button>') +
          '<a class="btn btn-ghost" href="/app-desafio.html">Voltar à jornada</a>' +
          "</div>" +
          '<div class="sinais-err" id="localErr"></div>' +
          "</div>";

        var input = $("zebraStakeInput");
        if (input) {
          input.addEventListener("input", function () {
            var cents = reaisToCents(input.value);
            var prev = recomputeLocal(cents);
            if (!prev) return;
            $("casaExact").textContent = money(prev.casaStakeCents);
            $("projReturn").textContent = money(prev.projectedReturnCents);
          });
        }
        var btn = $("btnConfirm");
        if (btn) {
          btn.addEventListener("click", async function () {
            $("localErr").textContent = "";
            btn.disabled = true;
            try {
              var amount = stakeEditable
                ? reaisToCents(($("zebraStakeInput") && $("zebraStakeInput").value) || "0")
                : zebra;
              if (!(amount > 0)) throw new Error("Informe o valor da aposta na zebra");
              var out = await registerEntry(amount);
              var sinal = (out && out.sinal) || state.sinal;
              alert(
                "Sinal confirmado!\n\nZebra: " +
                  money((sinal && sinal.zebraStakeCents) || amount) +
                  "\nCasa externa: " +
                  money((sinal && sinal.casaStakeCents) || casa) +
                  "\nRetorno projetado: " +
                  money((sinal && sinal.projectedReturnCents) || projected)
              );
              await load();
            } catch (ex) {
              var msg = (ex && ex.message) || "Erro ao confirmar";
              if (String(msg).indexOf("insufficient") >= 0) {
                msg = "Saldo do Desafio insuficiente. Transfira na Carteira.";
              } else if (String(msg).indexOf("already registered") >= 0) {
                msg = "Você já registrou esta entrada.";
              }
              $("localErr").textContent = msg;
              btn.disabled = false;
            }
          });
        }
      }

      async function load() {
        showErr("");
        var rows = await fetchDesafios();
        var picked = pickDesafioAndStep(rows, stepId);
        if (!picked) {
          state = null;
          paint();
          return;
        }
        stepId = picked.step.id;
        history.replaceState(null, "", "?stepId=" + encodeURIComponent(stepId));
        state = await buildManualSinalState(picked.desafio, picked.step);
        paint();
      }

      try {
        await load();
      } catch (ex) {
        console.warn("[sinais]", ex);
        showErr("");
        $("panel").innerHTML =
          '<div class="sinais-head"><h2>Painel de Sinais &amp; Arbitragem</h2></div>' +
          '<div class="sinais-block"><p class="sinais-hint">Aguardando evento de desafio lançado no admin.</p></div>';
      }

    })();
  </script>
</body>
</html>
