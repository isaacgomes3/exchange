<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>ArbiShield</title>
  <link rel="icon" type="image/png" href="/brand/favicon-192.png" />
  <link rel="apple-touch-icon" href="/brand/favicon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/v2.css" />
</head>
<body>
  <header class="mkt-header">
    <a class="brand" href="/" aria-label="ArbiShield">
      <img class="brand-logo" src="/brand/logo.png" srcset="/brand/logo.png 1x, /brand/logo@2x.png 2x" width="160" height="37" alt="ArbiShield" decoding="async" />
    </a>
    <nav class="mkt-nav">
      <a href="/auth.html">Entrar</a>
      <a class="cta" href="/app.html">App</a>
      <a href="/admin.html">Admin</a>
    </nav>
  </header>

  <section class="hero-bleed" aria-label="ArbiShield">
    <picture class="hero-media">
      <source media="(max-width: 720px)" srcset="/brand/stadium-hero-sm.jpg" width="900" height="506" />
      <img
        src="/brand/stadium-hero.jpg"
        width="1600"
        height="900"
        alt=""
        decoding="async"
        fetchpriority="high"
      />
    </picture>
    <div class="hero-inner">
      <p class="hero-brand">
        <img src="/brand/logo.png" srcset="/brand/logo.png 1x, /brand/logo@2x.png 2x" width="440" height="102" alt="ArbiShield" decoding="async" />
      </p>
      <h1>Proteção inteligente para operações esportivas</h1>
      <p class="lead">
        Mesmo banco e mesma marca — sistema novo, estável, sem o SPA que congelava.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/auth.html">Entrar</a>
        <a class="btn btn-ghost" href="/app.html">Área do membro</a>
      </div>
    </div>
  </section>
</body>
</html>
