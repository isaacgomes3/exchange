<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Em breve — ArbiShield v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/v2/v2.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="/v2/v2.js"></script>
  <script src="/v2/v2-shell.js" defer></script>
</head>
<body data-shell="admin" data-active="">
  <div class="page-head">
    <div>
      <h1 id="title">Em <span>breve</span></h1>
      <p class="sub">Só sistema novo · sem ligação ao SPA antigo</p>
    </div>
  </div>
  <div class="bridge-box">
    <h2 id="boxTitle">Módulo em construção</h2>
    <p>
      Esta função ainda não foi reescrita no v2. Não abrimos o site antigo de propósito —
      para não reintroduzir freezes e bugs do SPA.
    </p>
    <div class="actions" style="margin:0">
      <a class="btn btn-primary" id="back" href="/v2/admin.html">Voltar ao dashboard</a>
      <a class="btn btn-ghost" href="/v2/app.html">Área do membro</a>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var id = params.get("id") || "";
      var t = params.get("t") || "Módulo";
      var shell = "admin";
      var appIds = {
        proteger: 1, protecoes: 1, desafio: 1, carteira: 1, suporte: 1,
        afiliados: 1, partners: 1, "baixar-app": 1, perfil: 1, config: 1,
      };
      if (appIds[id]) shell = "app";
      document.body.setAttribute("data-shell", shell);
      document.body.setAttribute("data-active", id);
      document.getElementById("title").innerHTML = t.replace(/</g, "") + ' <span>em breve</span>';
      document.getElementById("boxTitle").textContent = t;
      document.getElementById("back").href = shell === "app" ? "/v2/app.html" : "/v2/admin.html";
      document.getElementById("back").textContent = shell === "app" ? "Visão geral" : "Voltar ao dashboard";
      document.title = t + " — Em breve · ArbiShield v2";

      ArbiV2.requireUser(ArbiV2.client());
    })();
  </script>
</body>
</html>
