<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Recuperar acesso — ArbiShield</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#020806;color:#f5f5f7;padding:24px}
.card{max-width:420px;width:100%;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px;background:#041a14}
h1{margin:0 0 8px;font-size:1.4rem}
p{color:#9aa;line-height:1.45}
button{display:inline-block;margin-top:12px;background:#d7ff1f;color:#000;border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>Recuperar o site</h1>
<p>Se o ArbiShield ficou em tela preta ou travou, limpe o cache local e reabra.</p>
<button id="go" type="button">Limpar cache e abrir o site</button>
<p id="msg"></p>
</div>
<script>
async function wipe(){
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  try{
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  try{localStorage.clear();sessionStorage.clear();}catch(e){}
  document.getElementById("msg").textContent="Cache limpo. Abrindo…";
  location.replace("/?recuperado=1&t="+Date.now());
}
document.getElementById("go").onclick=wipe;
</script>
</body>
</html>
