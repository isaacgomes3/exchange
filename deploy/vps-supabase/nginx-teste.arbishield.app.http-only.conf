# Bootstrap HTTP-only para teste.arbishield.app (antes do certbot).
# Substituído pela conf completa com SSL após emitir o certificado.

server {
    listen 80;
    listen [::]:80;
    server_name teste.arbishield.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arbishield-teste;
        default_type "text/plain";
    }

    add_header X-ArbiShield-Site "teste" always;
    client_max_body_size 50m;
    root /var/www/arbishield-teste/v2;

    location ~ ^/(auth|rest|storage|functions|graphql|realtime)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /api/arbishield/prelive-events {
        proxy_pass http://127.0.0.1:3198;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    location = /api/arbishield/matches {
        proxy_pass http://127.0.0.1:3198;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/protections {
        proxy_pass http://127.0.0.1:3198;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/create-protection {
        proxy_pass http://127.0.0.1:3198;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/desafios {
        proxy_pass http://127.0.0.1:3198;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/arbishield/(desafio-register|desafio-settle|desafio-sinal|desafio-sinal-preview|desafio-jornada|desafio-journey|desafio-participations|desafio-delete|desafio-cancel|desafio-pending-counts|partner-rounds|partner-distribute|transfer-desafio|affiliate-ensure-code|affiliate-withdraw|protection-close|protection-cancel|match-settle|contestations|contestations/submit|contestations/approve|contestations/reject|contestations/pending-count|dashboard-stats)$ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    location ^~ /api/arbishield/contestations {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    location ^~ /_serverFn/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        root /var/www/arbishield;
        try_files $uri =404;
    }

    location = /v2 { return 302 /; }
    location ^~ /v2/ { rewrite ^/v2/(.*)$ /$1 permanent; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
