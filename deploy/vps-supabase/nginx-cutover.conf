# ArbiShield — nginx HTTP (bootstrap / IP direto)
# Produção HTTPS: nginx-arbishield.app.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name arbishield.app www.arbishield.app 195.200.6.206 srv1841537.hstgr.cloud;

    client_max_body_size 50m;
    root /var/www/arbishield;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
    }

    # Supabase (Kong) — same-origin
    location ~ ^/(auth|rest|storage|functions|graphql|realtime)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Catálogo pré-live + criação de matches (Node :3098)
    location /api/arbishield/prelive-events {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    # Busca de times + logos (Admin Lançar Evento) — NÃO remover
    location /api/arbishield/football-teams {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }


    location = /api/arbishield/matches {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # Sync placar/tempo BetBra (inplay) — Node :3098
    location = /api/arbishield/match-live-sync {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }
    location = /api/arbishield/match-score-sync {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # Criar proteção (Proteger Aposta) — Node :3098
    location = /api/arbishield/protections {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /api/arbishield/create-protection {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # Desafios + sugestões surebet (Node :3099) — não depende do Next
    location = /api/arbishield/desafios {
        proxy_pass http://127.0.0.1:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/arbishield/(desafio-register|desafio-settle|desafio-sinal|desafio-sinal-preview|desafio-jornada|desafio-journey|desafio-participations|desafio-delete|desafio-cancel|desafio-pending-counts|partner-rounds|partner-distribute|transfer-desafio|affiliate-ensure-code|affiliate-withdraw|deduction-withdraw|protection-close|protection-cancel|match-settle)$ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    location = /api/arbishield/match-settle {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    # Sugestões BetBra removidas
    location /api/arbishield/desafio-suggestions {
        default_type application/json;
        return 410 '{"ok":false,"error":"Sugestões BetBra removidas"}';
    }

    # Painel geral (Next :3000)
    location = /api/arbishield/dashboard {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location /arbishield {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /desafio-sugestoes.html {
        try_files /desafio-sugestoes.html =404;
        add_header Cache-Control "no-store";
    }

    location = /assets/desafio-sugestoes-inject.js {
        try_files /assets/desafio-sugestoes-inject.js =404;
        add_header Cache-Control "no-store";
    }

    location = /admin/login {
        try_files /admin-login-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /auth {
        try_files /auth-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /admin/desafios {
        try_files /admin-desafios-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /admin/matches {
        try_files /admin-jogos-vps.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /adm {
        return 302 /admin;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /_serverFn/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
