# ArbiShield cutover: frontend estático + proxy da API Supabase (Kong)
# Frontend: http://195.200.6.206/
# API (mesma origem): /auth /rest /storage /realtime /functions /graphql

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 195.200.6.206 api.arbishield.app arbishield.app;

    client_max_body_size 50m;
    root /var/www/arbishield;
    index index.html;

    # Supabase API → Kong
    location ~ ^/(auth|rest|storage|functions|graphql|realtime)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
