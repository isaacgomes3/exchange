# ArbiShield cutover HTTP-only (IP / bootstrap).
# PRODUÇÃO com domínio: use nginx-arbishield.app.conf (HTTPS).
# NÃO copie este arquivo sobre /etc/nginx/conf.d/arbishield-cutover.conf
# se o certificado Let's Encrypt já estiver ativo — isso derruba a porta 443.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name arbishield.app www.arbishield.app 195.200.6.206 srv1841537.hstgr.cloud;

    client_max_body_size 50m;
    root /var/www/arbishield;
    index index.html;

    # Supabase API → Kong
    location ~ ^/(auth|rest|storage|functions|graphql|realtime)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # TanStack serverFn → shim local (Supabase)
    location ^~ /_serverFn/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
    }

    # Sugestões de desafio (BetBra → surebet ArbiShield)
    location = /api/arbishield/desafios {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }

    location /api/arbishield/desafio-suggestions {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /desafio-sugestoes.html {
        try_files /desafio-sugestoes.html =404;
        add_header Cache-Control "no-store";
    }

    location = /assets/desafio-sugestoes-inject.js {
        try_files /assets/desafio-sugestoes-inject.js =404;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Gestão de Desafios — página VPS (SPA sem serverFn completo)
    location = /admin/desafios {
        alias /var/www/arbishield/admin-desafios-vps.html;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
