# ArbiShield VPS — SOMENTE Desafio
# Corta /admin /app /auth /functions /rest e o restante do sistema antigo.

# HTTP → HTTPS
server {
  listen 80;
  server_name arbishield.app www.arbishield.app;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name arbishield.app www.arbishield.app;

  # Ajuste para os certificados da Hostinger / Let's Encrypt
  ssl_certificate     /etc/letsencrypt/live/arbishield.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/arbishield.app/privkey.pem;

  # Raiz e HTML legado → Desafio
  location = / {
    return 302 /desafio-sugestoes;
  }

  location = /desafio-sugestoes.html {
    return 302 /desafio-sugestoes;
  }

  location = /desafio-sugestoes {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/desafio/puxar {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets do Next (obrigatório para a UI do Desafio)
  location /_next/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Todo o resto do sistema antigo: cortado
  location / {
    return 404;
  }
}
