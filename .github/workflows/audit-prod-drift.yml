name: Auditoria de desvio (produção × git)

# `main` já é a fonte de verdade, então a auditoria agendada vira alarme: acusa
# arquivo editado no servidor sem commit antes de o cliente reclamar. Estar
# ATRASADO em relação a main é normal entre mesclar e publicar — não falha.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      origin:
        description: "Origem a auditar"
        default: "https://arbishield.app"
        required: false
      mainline_ref:
        description: "Referência que deveria estar publicada"
        default: "origin/main"
        required: false
      strict:
        description: "Falhar também quando produção estiver atrasada em relação a main"
        type: boolean
        default: false
        required: false

jobs:
  audit:
    name: Comparar produção com o repositório
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar todas as branches
        run: git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Auditar
        run: node scripts/audit-prod-drift.mjs
        env:
          ARBISHIELD_ORIGIN: ${{ inputs.origin || 'https://arbishield.app' }}
          ARBISHIELD_MAINLINE_REF: ${{ inputs.mainline_ref || 'origin/main' }}
          ARBISHIELD_AUDIT_ALLOW_BEHIND: ${{ inputs.strict == true && '0' || '1' }}
